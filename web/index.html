<style>
  :root{
    /* ---- M3-inspired tonal palette, derived from ABC Selaras brand green ---- */
    --primary:#146B5E;
    --primary-dark:#0B4B41;
    --primary-light:#4FA090;
    --primary-container:#A6F2E1;
    --on-primary-container:#00201B;
    --gold:#7C5900;
    --gold-container:#FFDF99;
    --on-gold-container:#271900;
    --bg:#F5FAF6;
    --surface:#FFFFFF;
    --surface-container-low:#F1F6F1;
    --surface-container:#EBF1EB;
    --surface-container-high:#E5EBE3;
    --surface-container-highest:#DFE5DD;
    --border:#DEE5DD;
    --outline:#70796F;
    --text:#191D1A;
    --text-muted:#454C45;
    --success:#2E7D32;
    --success-bg:#E5F3E6;
    --warning:#8A5700;
    --warning-bg:#FFE6C0;
    --danger:#BA1A1A;
    --danger-bg:#FFDAD6;
    --neutral:#6F796F;
    --neutral-bg:#ECF1EA;
    --info:#0061A4;
    --info-bg:#D7E7FA;
    --radius:16px;
    --shadow-1:0 1px 2px rgba(20,30,25,.10), 0 1px 4px rgba(20,30,25,.06);
    --shadow-2:0 2px 8px rgba(20,30,25,.12), 0 1px 3px rgba(20,30,25,.08);
    --shadow-3:0 10px 28px rgba(15,25,20,.20), 0 2px 8px rgba(15,25,20,.10);
    --font-sans:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-serif:"Roboto Serif","Georgia",serif;
  }
  body.dark{
    --primary:#86D5C2;
    --primary-container:#00504A;
    --on-primary-container:#A2F2E0;
    --gold:#F0C349;
    --gold-container:#5B4300;
    --on-gold-container:#FFDF99;
    --bg:#101511;
    --surface:#181D19;
    --surface-container-low:#181D19;
    --surface-container:#1C211D;
    --surface-container-high:#262B26;
    --surface-container-highest:#313631;
    --border:#333930;
    --outline:#8A9389;
    --text:#E2E6DD;
    --text-muted:#C1C9BE;
    --success:#8FDB98;
    --success-bg:#1C3620;
    --warning:#FFC067;
    --warning-bg:#3C2E0A;
    --danger:#FFB4AB;
    --danger-bg:#5C0E09;
    --neutral:#8D968C;
    --neutral-bg:#242923;
    --info:#9ECBFF;
    --info-bg:#153154;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    transition:background .15s,color .15s;
  }
  body.dark{ color-scheme: dark; }
  #app{min-height:100vh;}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  a{color:inherit;}

  /* ---------- Loading / Login ---------- */
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .loading-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);display:inline-block;animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.85);}50%{opacity:1;transform:scale(1.05);}}

  .login-wrap{
    width:100%;max-width:880px;background:var(--surface);border-radius:28px;overflow:hidden;
    display:grid;grid-template-columns:1fr 1fr;box-shadow:var(--shadow-3);
  }
  .login-brand{
    background:linear-gradient(155deg,var(--primary-dark),var(--primary));
    color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .login-brand h1{font-family:var(--font-serif);font-size:28px;font-weight:500;margin:0 0 12px;letter-spacing:.2px;}
  .login-brand p{color:rgba(255,255,255,.82);font-size:13.5px;max-width:280px;}
  .login-brand .brand-mark{font-size:13px;letter-spacing:1.5px;opacity:.8;text-transform:uppercase;}
  .login-brand .brand-foot{font-size:12px;color:rgba(255,255,255,.6);}
  .login-brand .brand-credit{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px;}
  .app-footer{padding:16px 28px;text-align:center;font-size:11.5px;color:var(--text-muted);border-top:1px solid var(--border);}
  .login-form-area{padding:44px 40px;}
  .tab-switch{display:flex;background:var(--surface-container);border-radius:999px;padding:4px;margin-bottom:26px;}
  .tab-switch button{flex:1;border:none;background:transparent;padding:9px 0;border-radius:999px;cursor:pointer;font-weight:600;color:var(--text-muted);transition:background .15s,color .15s;}
  .tab-switch button.active{background:var(--primary);color:#fff;box-shadow:var(--shadow-1);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:11px 14px;border:1.5px solid var(--outline);border-radius:14px;background:var(--surface);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary);}
  .login-error{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:14px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 22px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:13.5px;
    transition:filter .12s, background .12s, box-shadow .12s;
  }
  .btn:active{filter:brightness(.95);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-1);}
  .btn-primary:hover{background:var(--primary-light);box-shadow:var(--shadow-2);}
  .btn-block{width:100%;}
  .btn-secondary{background:var(--surface-container-high);border:1px solid transparent;color:var(--on-primary-container);}
  .btn-secondary:hover{background:var(--surface-container-highest);}
  .btn-danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-ghost{background:transparent;border:1px solid transparent;color:var(--on-primary-container);}
  .btn-ghost:hover{background:var(--surface-container-high);}
  .btn-sm{padding:7px 14px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .login-hint{font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.6;}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;flex-shrink:0;background:var(--primary-dark);color:#fff;
    display:flex;flex-direction:column;padding:22px 0;
  }
  .sidebar-brand{padding:0 20px 22px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px;}
  .sidebar-brand .name{font-family:var(--font-serif);font-size:19px;font-weight:500;}
  .sidebar-brand .role{font-size:11.5px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
  .sidebar-close{display:none;margin-left:auto;background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex-shrink:0;align-self:flex-start;}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:calc(100% - 24px);margin:2px 12px;text-align:left;background:none;border:none;color:rgba(255,255,255,.85);
    padding:11px 18px;font-size:13.5px;cursor:pointer;border-radius:999px;font-weight:500;transition:background .15s,color .15s;
  }
  .nav-item:hover{background:rgba(255,255,255,.10);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.94);color:var(--primary-dark);font-weight:700;}
  .nav-icon{flex-shrink:0;display:inline-flex;opacity:.9;}
  .nav-item.active .nav-icon{opacity:1;color:var(--primary-dark);}
  .sidebar-foot{margin-top:auto;padding:16px 20px 0;}
  .sidebar-user{font-size:12.5px;color:rgba(255,255,255,.68);margin-bottom:10px;line-height:1.5;}
  .sidebar-user strong{color:#fff;display:block;font-size:13.5px;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .topbar h2{font-family:var(--font-serif);font-weight:500;font-size:21px;margin:0;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .month-input{padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface-container-low);font-weight:600;}
  .hamburger{display:inline-flex;align-items:center;justify-content:center;background:var(--surface-container-low);border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;}
  .content{padding:26px 28px 60px;max-width:1180px;width:100%;}

  /* ---------- Generic components ---------- */
  .card{background:var(--surface-container-low);border:1px solid transparent;border-radius:var(--radius);padding:20px;}
  .card + .card{margin-top:18px;}
  .card-title{font-weight:700;font-size:15px;margin:0 0 4px;}
  .card-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 16px;}
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

  .stat-card{background:var(--surface-container-low);border:1px solid transparent;border-radius:var(--radius);padding:18px;}
  .stat-card .label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-family:var(--font-serif);font-size:26px;font-weight:500;}
  .stat-card .sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);
     padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .muted{color:var(--text-muted);}

  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge-success{background:var(--success-bg);color:var(--success);}
  .badge-warning{background:var(--warning-bg);color:var(--warning);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-neutral{background:var(--neutral-bg);color:var(--neutral);}
  .badge-info{background:var(--info-bg);color:var(--info);}

  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
  .form-group input, .form-group select, .form-group textarea{
    width:100%;padding:10px 13px;border:1.5px solid var(--outline);border-radius:14px;background:var(--surface);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:600px){.form-row{grid-template-columns:1fr;}}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .checkbox-row input{width:auto;accent-color:var(--primary);}
  .checkbox-row label{margin:0;font-size:13px;font-weight:500;color:var(--text);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .section-title{font-weight:700;font-size:14.5px;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .empty-state{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13.5px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,20,17,.5);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .modal{background:var(--surface-container-high);border-radius:28px;padding:28px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-3);}
  .modal h3{margin:0 0 18px;font-family:var(--font-serif);font-weight:500;font-size:20px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow-3);
    opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
  .bar-row .bar-label{width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:var(--surface-container-high);border-radius:999px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--warning);border-radius:999px;}
  .bar-val{width:56px;text-align:right;flex-shrink:0;color:var(--text-muted);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-head{text-align:center;font-size:11px;font-weight:700;color:var(--text-muted);padding:4px 0;text-transform:uppercase;}
  .cal-day{border:1px solid var(--border);border-radius:14px;padding:6px 5px;min-height:58px;font-size:11px;background:var(--surface-container-low);}
  .cal-day.cal-empty{border-color:transparent;background:transparent;}
  .cal-daynum{font-weight:700;font-size:12px;margin-bottom:3px;}
  .cal-info{color:var(--text-muted);line-height:1.3;word-break:break-word;}
  .cal-day.cal-kerja{background:var(--success-bg);border-color:transparent;}
  .cal-day.cal-kerja .cal-info{color:var(--success);}
  .cal-day.cal-libur{background:var(--neutral-bg);border-color:transparent;}
  .cal-day.cal-cuti{background:var(--info-bg);border-color:transparent;}
  .cal-day.cal-cuti .cal-info{color:var(--info);}
  .cal-day.cal-unset{background:var(--surface-container-low);}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--text-muted);}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .cal-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .cal-dot.cal-kerja{background:var(--success);}
  .cal-dot.cal-libur{background:var(--neutral);}
  .cal-dot.cal-cuti{background:var(--info);}
  .cal-dot.cal-unset{background:var(--surface);border:1px solid var(--border);}
  .cal-day.cal-clickable{cursor:pointer;min-height:74px;transition:box-shadow .12s,border-color .12s;}
  .cal-day.cal-clickable:hover{border-color:var(--primary);box-shadow:var(--shadow-1);}
  .cal-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px;}
  .cal-tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;}
  .cal-tag-kerja{background:var(--success);color:#fff;}
  .cal-tag-libur{background:var(--neutral);color:#fff;}
  .cal-tag-cuti{background:var(--info);color:#fff;}
  .cal-tag-unset{background:var(--surface-container-highest);color:var(--text-muted);}

  .bar-chart-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-chart-label{width:118px;flex-shrink:0;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-chart-track{flex:1;height:16px;background:var(--surface-container-high);border-radius:999px;overflow:hidden;position:relative;}
  .bar-chart-fill{height:100%;border-radius:999px;transition:width .3s;}
  .bar-chart-fill.bar-tercapai{background:var(--success);}
  .bar-chart-fill.bar-mendekati{background:var(--warning);}
  .bar-chart-fill.bar-perhatian{background:var(--danger);}
  .bar-chart-val{width:52px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:700;color:var(--text);}
  .kpi-cat-header{font-weight:700;font-size:12.5px;color:var(--on-primary-container);background:var(--primary-container);padding:8px 12px;border-radius:12px;margin:10px 0 4px;}
  .condition-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .condition-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface-container-low);cursor:pointer;color:var(--text-muted);transition:border-color .12s,background .12s;}
  .condition-card .condition-label{font-size:12px;font-weight:600;}
  .condition-card.condition-sehat.active{border-color:var(--success);background:var(--success-bg);color:var(--success);}
  .condition-card.condition-kurang_sehat.active{border-color:var(--warning);background:var(--warning-bg);color:var(--warning);}
  .condition-card.condition-sakit.active{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
  .type-select-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px;}
  .type-select-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface-container-low);cursor:pointer;color:var(--text-muted);transition:border-color .12s,background .12s;}
  .type-select-card .type-select-label{font-size:11.5px;font-weight:600;text-align:center;}
  .type-select-card.active{border-color:var(--primary);background:var(--primary-container);color:var(--on-primary-container);}

  .dash-profile-card{background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border-radius:28px;padding:22px 24px;display:flex;align-items:center;gap:16px;margin-bottom:16px;box-shadow:var(--shadow-2);}
  .dash-profile-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:22px;font-weight:500;flex-shrink:0;}
  .dash-profile-name{font-size:17px;font-weight:700;}
  .dash-profile-sub{font-size:12px;opacity:.85;margin-top:3px;}
  .dash-status-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .dash-status-pill{border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);background:var(--surface-container-low);}
  .dash-status-pill.done{background:var(--success-bg);border-color:transparent;}
  .dash-status-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface-container-high);color:var(--text-muted);}
  .dash-status-pill.done .dash-status-icon{background:var(--success);color:#fff;}
  .dash-status-label{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .dash-status-value{font-size:16px;font-weight:700;margin-top:1px;}
  .dash-status-date{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .dash-quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:10px;margin-bottom:16px;}
  .dash-quick-btn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;border-radius:20px;background:var(--surface-container-low);border:1px solid transparent;cursor:pointer;color:var(--text);transition:background .12s;}
  .dash-quick-btn:hover{background:var(--surface-container-high);}
  .dash-quick-btn .dash-quick-icon{width:42px;height:42px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;justify-content:center;}
  .dash-quick-btn .dash-quick-label{font-size:11px;font-weight:600;text-align:center;}

  .geo-match-box{border-radius:16px;padding:11px 15px;margin-top:10px;border:1.5px solid;}
  .geo-match-box.geo-ok{background:var(--success-bg);border-color:var(--success);}
  .geo-match-box.geo-warn{background:var(--warning-bg);border-color:var(--warning);}
  .geo-match-title{font-weight:700;font-size:12.5px;}
  .geo-match-box.geo-ok .geo-match-title{color:var(--success);}
  .geo-match-box.geo-warn .geo-match-title{color:var(--warning);}
  .geo-match-address{font-size:11px;color:var(--text-muted);margin-top:3px;}
  @media(max-width:700px){
    .cal-day{min-height:44px;font-size:9.5px;padding:4px 3px;}
    .cal-info{display:none;}
  }

  .notif-bell-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:var(--surface-container-low);color:var(--text);cursor:pointer;flex-shrink:0;transition:background .12s;}
  .notif-bell-btn:hover{background:var(--surface-container-high);}
  .theme-toggle-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:var(--surface-container-low);color:var(--text);cursor:pointer;flex-shrink:0;transition:background .12s;}
  .theme-toggle-btn:hover{background:var(--surface-container-high);}
  .notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;border:2px solid var(--surface);}

  .notif-panel{
    position:absolute;top:calc(100% + 10px);right:0;width:320px;max-width:88vw;background:var(--surface-container-high);
    border:1px solid transparent;border-radius:20px;box-shadow:var(--shadow-3);z-index:80;overflow:hidden;
  }
  .notif-panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
  .notif-list{max-height:340px;overflow-y:auto;}
  .notif-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--surface-container-highest);}
  .notif-item.unread{background:var(--info-bg);}
  .notif-item.unread:hover{background:var(--info-bg);filter:brightness(.97);}
  .notif-item.unread::before{content:'';position:absolute;left:6px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--info);}
  .notif-item.unread .notif-msg{padding-left:12px;}
  .notif-msg{font-size:13px;line-height:1.45;}
  .notif-time{font-size:11px;color:var(--text-muted);margin-top:3px;}

  .slip{border:1px solid var(--border);border-radius:20px;padding:26px;background:#fff;}
  .slip-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--primary-dark);padding-bottom:14px;margin-bottom:16px;}
  .slip-head .co-name{font-family:var(--font-serif);font-size:20px;font-weight:500;}
  .slip-head .co-addr{font-size:12px;color:var(--text-muted);}
  .slip-head .doc-tag{text-align:right;font-size:12px;color:var(--text-muted);}
  .slip-emp{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:18px;font-size:13px;}
  .slip-emp div span{color:var(--text-muted);}
  .slip-table th{background:var(--neutral-bg);}
  .slip-total-row td{font-weight:700;border-top:2px solid var(--primary-dark);font-size:15px;}
  .slip-foot{display:flex;justify-content:space-between;margin-top:36px;font-size:12.5px;}
  .sign-box{text-align:center;width:160px;}
  .sign-line{border-top:1px solid var(--text);margin-top:52px;padding-top:4px;}

  .deduction-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .deduction-item:last-child{border-bottom:none;}

  @media(max-width:860px){
    .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:90;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    .sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(0,0,0,.35);}
    .hamburger{display:inline-flex;align-items:center;justify-content:center;}
    .sidebar-close{display:inline-flex;align-items:center;justify-content:center;}
    .content{padding:18px 16px 50px;}
    .topbar{padding:12px 16px;}
    .topbar-right{width:100%;justify-content:flex-end;}
    .login-wrap{grid-template-columns:1fr;}
    .login-brand{padding:30px 26px;}
  }

  @media print{
    .sidebar, .topbar, .no-print{display:none !important;}
    .content{padding:0;max-width:none;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;}
  }

  /* ---- Banner ---- */
  .banner-wrap{position:relative;margin-bottom:16px;}
  .banner-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--radius);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .banner-track::-webkit-scrollbar{display:none;}
  .banner-slide{flex:0 0 100%;scroll-snap-align:start;min-height:136px;padding:22px 22px 32px;display:flex;align-items:flex-end;color:#fff;box-sizing:border-box;}
  .banner-title{font-family:var(--font-serif);font-size:21px;font-weight:500;line-height:1.25;}
  .banner-sub{font-size:13px;opacity:.92;margin-top:6px;}
  .banner-dots{position:absolute;left:0;right:0;bottom:11px;display:flex;justify-content:center;gap:6px;pointer-events:none;}
  .banner-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:all .2s;}
  .banner-dot.active{background:#fff;width:16px;border-radius:3px;}
  .banner-thumb{width:56px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;}
  /* ---- To-Do ---- */
  .todo-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .todo-tab{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 16px;border-radius:999px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .todo-tab.active{background:var(--primary-container);color:var(--on-primary-container);border-color:transparent;}
  .todo-item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);}
  .todo-item:last-child{border-bottom:0;}
  .todo-item.done .todo-title{text-decoration:line-through;color:var(--text-muted);}
  .todo-main{min-width:0;flex:1;}
  .todo-owner{font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:2px;}
  .todo-title{font-weight:600;font-size:14.5px;word-break:break-word;}
  .todo-note{font-size:12.5px;color:var(--text-muted);margin-top:3px;word-break:break-word;}
  .todo-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .todo-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .todo-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:13.5px;flex-wrap:wrap;}
  .alert-row{padding:10px 0;border-top:1px solid var(--border);font-size:13.5px;}
  .alert-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .alert-flags .badge{white-space:normal;}
  .todo-widget-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px;}
  .todo-widget-stats div{background:var(--surface-container);border-radius:12px;padding:12px;text-align:center;}
  .todo-widget-stats strong{display:block;font-family:var(--font-serif);font-size:24px;font-weight:500;}
  .todo-widget-stats span{font-size:11.5px;color:var(--text-muted);}
  /* ---- Timeline Aktivitas ---- */
  .tl-day{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px;}
  .tl-item{display:flex;gap:12px;padding:8px 0;}
  .tl-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0;}
  .tl-item.warn .tl-dot{background:var(--danger);}
  .tl-text{font-size:13.5px;word-break:break-word;}
  .tl-time{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  /* ---- Pengaturan notifikasi ---- */
  .pref-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--border);}
  .pref-label{font-weight:600;font-size:14px;}
  .pref-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  .m3-switch{position:relative;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--surface-container-highest);cursor:pointer;flex-shrink:0;padding:0;transition:background .2s,border-color .2s;}
  .m3-switch-knob{position:absolute;top:50%;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all .2s;}
  .m3-switch.on{background:var(--primary);border-color:var(--primary);}
  .m3-switch.on .m3-switch-knob{left:24px;width:22px;height:22px;background:#fff;}
  .m3-switch:disabled{opacity:.45;cursor:not-allowed;}

  /* ---- Avatar / foto profil ---- */
  .avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);font-weight:700;overflow:hidden;flex-shrink:0;line-height:1;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-hr{background:var(--gold-container);color:var(--on-gold-container);}
  .dash-profile-avatar{border:0;padding:0;color:inherit;cursor:pointer;overflow:hidden;}
  .dash-profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
  @media(min-width:861px){.shell.sidebar-collapsed .sidebar{display:none;}}
  /* ---- Chat ---- */
  .chat-wrap{display:grid;grid-template-columns:320px 1fr;background:var(--surface-container-low);border-radius:var(--radius);overflow:hidden;height:calc(100vh - 190px);min-height:420px;}
  .chat-list-pane{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .chat-search{padding:12px;}
  .chat-search input{width:100%;box-sizing:border-box;}
  .chat-list{overflow-y:auto;flex:1;}
  .chat-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 14px;cursor:pointer;color:inherit;font:inherit;}
  .chat-item:hover{background:var(--surface-container);}
  .chat-item.active{background:var(--primary-container);color:var(--on-primary-container);}
  .chat-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .chat-item-top{display:flex;justify-content:space-between;gap:8px;}
  .chat-item-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-item-time{font-size:11px;color:var(--text-muted);flex-shrink:0;}
  .chat-item-prev{font-size:12.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-item-prev.unread{color:var(--text);font-weight:700;}
  .chat-unread{background:var(--primary);color:var(--surface);min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
  .chat-thread-pane{display:flex;flex-direction:column;min-height:0;min-width:0;}
  .chat-head{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
  .chat-head-name{font-weight:700;font-size:14.5px;}
  .chat-head-sub{font-size:12px;color:var(--text-muted);}
  .chat-back{display:none;}
  .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;}
  .chat-msg{max-width:78%;display:flex;flex-direction:column;}
  .chat-msg.mine{align-self:flex-end;align-items:flex-end;}
  .chat-msg.theirs{align-self:flex-start;}
  .chat-bubble{padding:9px 14px;border-radius:18px;font-size:14px;white-space:pre-wrap;word-break:break-word;}
  .chat-msg.mine .chat-bubble{background:var(--primary-container);color:var(--on-primary-container);border-bottom-right-radius:6px;}
  .chat-msg.theirs .chat-bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px;}
  .chat-msg-time{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .chat-day{align-self:center;font-size:11.5px;color:var(--text-muted);background:var(--surface-container);padding:3px 12px;border-radius:999px;margin:10px 0 4px;}
  .chat-compose{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border);background:var(--surface);align-items:flex-end;}
  .chat-compose textarea{flex:1;resize:none;max-height:120px;border-radius:20px;padding:10px 16px;font:inherit;border:1px solid var(--border);background:var(--surface-container-low);color:var(--text);}
  .chat-empty{margin:auto;text-align:center;color:var(--text-muted);display:flex;flex-direction:column;gap:10px;align-items:center;}
  @media(max-width:860px){
    .chat-wrap{grid-template-columns:1fr;height:calc(100vh - 170px);}
    .chat-wrap .chat-thread-pane{display:none;}
    .chat-wrap.has-thread .chat-list-pane{display:none;}
    .chat-wrap.has-thread .chat-thread-pane{display:flex;}
    .chat-back{display:inline-flex;}
  }
.chat-search input{width:100%;box-sizing:border-box;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;outline:none;}
  .chat-search input:focus{border-color:var(--primary);}
  
  /* ---- Chat v2: FAB, foto, hapus pesan ---- */
  .chat-fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-3);cursor:pointer;z-index:60;padding:0;}
  .chat-fab:hover{filter:brightness(1.1);}
  .chat-fab-badge{position:absolute;top:-3px;right:-3px;background:var(--danger);color:#fff;min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--surface);box-sizing:border-box;}
  .chat-list-head{display:flex;align-items:center;gap:8px;padding:12px 12px 0;}
  .chat-list-title{font-weight:700;font-size:15px;flex:1;}
  .chat-head-main{flex:1;min-width:0;}
  .chat-head-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
  .chat-img{display:block;max-width:240px;width:100%;max-height:260px;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--surface-container);min-height:60px;}
  .chat-bubble.has-img{padding:6px;}
  .chat-bubble.has-img .chat-text{padding:6px 8px 2px;}
  .chat-bubble.is-task{border-left:4px solid var(--primary);}
  .chat-task-tag{font-size:11.5px;font-weight:700;color:var(--primary);margin-bottom:3px;}
  .chat-bubble.has-img .chat-task-tag{padding:4px 8px 0;}
  .chat-text{white-space:pre-wrap;word-break:break-word;}
  .chat-del{background:none;border:0;color:var(--danger);font:inherit;font-size:11px;font-weight:700;cursor:pointer;margin-left:8px;padding:0;}
  .chat-compose-wrap{border-top:1px solid var(--border);background:var(--surface);}
  .chat-compose-wrap .chat-compose{border-top:0;}
  .chat-attach{padding:8px;border-radius:50%;min-width:0;}
  .chat-pending{display:flex;align-items:center;gap:10px;padding:8px 14px 0;font-size:12.5px;color:var(--text-muted);}
  .chat-pending img{width:44px;height:44px;border-radius:8px;object-fit:cover;}
  .chat-pending span{flex:1;}
  .todo-photo{display:block;max-width:180px;max-height:130px;object-fit:cover;border-radius:10px;margin-top:8px;cursor:zoom-in;background:var(--surface-container);}
  .img-viewer{background:rgba(0,0,0,.85);flex-direction:column;gap:14px;}
  .img-viewer img{max-width:100%;max-height:78vh;border-radius:8px;}
  @media(max-width:860px){.chat-fab{right:16px;bottom:16px;}}

  /* ---- Menu samping berkelompok ---- */
  .nav-item{padding:10px 18px;}
  .nav-group{margin-top:4px;}
  .nav-group-head{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);margin:0 12px;padding:9px 18px;background:none;border:0;color:rgba(255,255,255,.58);font:inherit;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;border-radius:999px;text-align:left;}
  .nav-group-head:hover{color:#fff;background:rgba(255,255,255,.07);}
  .nav-group.has-active .nav-group-head{color:#fff;}
  .nav-group-label{flex:1;}
  .nav-group-chev{display:inline-flex;transition:transform .2s;opacity:.8;}
  .nav-group.open .nav-group-chev{transform:rotate(180deg);}
  .nav-group-items{display:none;}
  .nav-group.open .nav-group-items{display:block;}
  .nav-group.open .nav-group-badge{display:none;}
  .nav-group-badge{margin-left:0;}

  /* panel notifikasi tidak boleh keluar layar di HP */
  .notif-list{max-height:min(340px,55vh);}
  @media(max-width:860px){
    .notif-panel{position:fixed;left:12px;right:12px;width:auto;max-width:none;}
  }
</style>
</head>

function saveSessionToStorage(){
  try{ localStorage.setItem('abcSelarasSession', JSON.stringify(SESSION)); }catch(e){}
}
function clearSessionFromStorage(){
  try{ localStorage.removeItem('abcSelarasSession'); }catch(e){}
}
function restoreSessionFromStorage(){
  var saved;
  try{ saved = JSON.parse(localStorage.getItem('abcSelarasSession')||'null'); }catch(e){ saved = null; }
  if(!saved || !saved.role) return;
  if(saved.role==='hr'){
    if(!saved.hrAccountId){
      SESSION = {role:'hr', empId:null, hrAccountId:null};
    } else {
      var acct = (DB.hrAccounts||[]).find(function(a){ return a.id===saved.hrAccountId; });
      if(acct){
        SESSION = {role:'hr', empId:null, hrAccountId:acct.id};
      } else {
        clearSessionFromStorage();
      }
    }
  } else if(saved.empId){
    var emp = getEmployee(saved.empId);
    if(emp && emp.active){
      SESSION = {role: isHOD(emp.id) ? 'hod' : 'staff', empId: emp.id};
    } else {
      clearSessionFromStorage();
    }
  }
}

function startCameraStream(){
  if(CHECKIN_CAMERA_STATUS==='starting' || CHECKIN_CAMERA_STATUS==='ready') return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    CHECKIN_CAMERA_STATUS = 'error';
    render();
    return;
  }
  CHECKIN_CAMERA_STATUS = 'starting';
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false}).then(function(stream){
    CHECKIN_STREAM = stream;
    CHECKIN_CAMERA_STATUS = 'ready';
    render();
  }).catch(function(err){
    console.error('getUserMedia error', err);
    CHECKIN_CAMERA_STATUS = 'error';
    render();
  });
}

function captureFromVideo(videoEl, maxDim, quality){
  var w = videoEl.videoWidth || 480, h = videoEl.videoHeight || 480;
  var scale = Math.min(1, maxDim / Math.max(w,h));
  var canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(w*scale));
  canvas.height = Math.max(1, Math.round(h*scale));
  var ctx = canvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality||0.6);
}

function tenureText(joinDateISO){
  if(!joinDateISO) return '-';
  var start = new Date(joinDateISO+'T00:00:00');
  if(isNaN(start)) return '-';
  var now = new Date();
  var years = now.getFullYear() - start.getFullYear();
  var months = now.getMonth() - start.getMonth();
  if(now.getDate() < start.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  if(years < 0) return 'Belum mulai bekerja';
  var parts = [];
  if(years > 0) parts.push(years+' tahun');
  if(months > 0 || years===0) parts.push(months+' bulan');
  return parts.join(' ');
}

function ageText(dobISO){
  if(!dobISO) return null;
  var dob = new Date(dobISO+'T00:00:00');
  if(isNaN(dob)) return null;
  var now = new Date();
  var age = now.getFullYear() - dob.getFullYear();
  var m = now.getMonth() - dob.getMonth();
  if(m < 0 || (m===0 && now.getDate() < dob.getDate())) age--;
  return age;
}

/* ---------------------------- ID KARYAWAN OTOMATIS ----------------------------
   Format: {KodeProperti}-{TahunGabung}-{TanggalBulanLahir}-{Urutan}
   Contoh: KLY-24-2005-003 (Kaly, gabung 2024, lahir 20 Mei, karyawan ke-3) */
var PROPERTY_CODE_MAP = {
  'Kaly':'KLY', 'Padi Heritage':'PHR', 'Briggs Inn Surabaya':'BIS', 'Briggs Inn Batu':'BIB'
};
function propertyCode(propName){
  if(!propName) return 'XXX';
  if(PROPERTY_CODE_MAP[propName]) return PROPERTY_CODE_MAP[propName];
  var clean = String(propName).replace(/[^a-zA-Z]/g,'').toUpperCase();
  return clean.slice(0,3) || 'XXX';
}
function pad3(n){ n = String(n); while(n.length<3){ n = '0'+n; } return n; }
function generateEmployeeCode(data){
  var propPart = (data.properties && data.properties[0]) ? propertyCode(data.properties[0]) : 'XXX';
  var yearPart = data.joinDate ? data.joinDate.slice(2,4) : '00';
  var dobPart = '0000';
  if(data.dateOfBirth){
    var p = data.dateOfBirth.split('-');
    if(p.length===3) dobPart = p[2]+p[1];
  }
  DB.nextEmployeeSeq = DB.nextEmployeeSeq || 1;
  var seqPart = pad3(DB.nextEmployeeSeq);
  DB.nextEmployeeSeq++;
  return propPart+'-'+yearPart+'-'+dobPart+'-'+seqPart;
}

function eachDateInRange(startISO, endISO, cb){
  var start = new Date(startISO+'T00:00:00');
  var end = new Date(endISO+'T00:00:00');
  if(isNaN(start) || isNaN(end)) return;
  var cur = new Date(start);
  var guard = 0;
  while(cur.getTime() <= end.getTime() && guard < 400){
    cb(cur.getFullYear(), cur.getMonth()+1, cur.getDate());
    cur.setDate(cur.getDate()+1);
    guard++;
  }
}

function timeAgoID(iso){
  if(!iso) return '';
  var then = new Date(iso).getTime();
  if(isNaN(then)) return '';
  var diffSec = Math.max(0, Math.floor((Date.now()-then)/1000));
  if(diffSec < 60) return 'Baru saja';
  var diffMin = Math.floor(diffSec/60);
  if(diffMin < 60) return diffMin+' menit lalu';
  var diffHour = Math.floor(diffMin/60);
  if(diffHour < 24) return diffHour+' jam lalu';
  var diffDay = Math.floor(diffHour/24);
  if(diffDay < 7) return diffDay+' hari lalu';
  var d = new Date(iso);
  return d.getDate()+' '+MONTHS_ID[d.getMonth()]+' '+d.getFullYear();
}

function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i=0;i<rawData.length;i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}

    body: JSON.stringify({recipient:recipient, subscription:subscriptionJson})

function enablePushNotifications(){
  if(isNativeApp()){
    requestNativeNotifPermission().then(function(ok){
      if(ok && fcmAvailable()) fcmInit();
      toast(ok ? 'Notifikasi aplikasi diaktifkan.' : 'Izin notifikasi ditolak. Aktifkan lewat Pengaturan Android.');
      render();
    });
    return;
  }
  if(!pushSupported() || !pushConfigured()){
    if(!('Notification' in window)){ toast('Browser/perangkat ini tidak mendukung notifikasi.'); return; }
    Notification.requestPermission().then(function(perm){
      toast(perm==='granted' ? 'Notifikasi diaktifkan (muncul saat situs terbuka di latar belakang).' : 'Izin notifikasi ditolak. Aktifkan lewat pengaturan browser.');
      render();
    });
    return;
  }
  navigator.serviceWorker.register('sw.js').then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if(perm !== 'granted'){
        toast('Izin notifikasi ditolak. Aktifkan lewat pengaturan browser kalau berubah pikiran.');
        return null;
      }
      return reg.pushManager.getSubscription().then(function(existing){
        if(existing) return existing;
        return reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      });
    });
  }).then(function(sub){
    if(!sub) return;
    return savePushSubscription(currentPushRecipient(), sub.toJSON());
  }).then(function(){
    toast('Notifikasi perangkat diaktifkan.');
    render();
  }).catch(function(err){
    console.error('enablePushNotifications error', err);
    toast('Gagal mengaktifkan notifikasi perangkat.');
  });
}

/* ---------------------------- CHUNKED FILE STORAGE ----------------------------
   Sel Google Spreadsheet dibatasi ~50.000 karakter, jadi file (foto/dokumen)
   yang disimpan sebagai base64 dipecah jadi beberapa "chunk" dan disimpan
   sebagai key terpisah, lalu disambung lagi saat dibaca. */
var FILE_CHUNK_SIZE = 40000;

function storageSetChunked(baseKey, longString, onProgress){
  var chunks = [];
  for(var i=0; i<longString.length; i+=FILE_CHUNK_SIZE){
    chunks.push(longString.slice(i, i+FILE_CHUNK_SIZE));
  }
  if(chunks.length===0) chunks.push('');
  var done = 0;
  var writeNext = function(idx){
    if(idx>=chunks.length){
      return storageSet(baseKey+'__meta', JSON.stringify({count:chunks.length}));
    }
    return storageSet(baseKey+'__chunk'+idx, chunks[idx]).then(function(){
      done++;
      if(onProgress) onProgress(done, chunks.length);
      return writeNext(idx+1);
    });
  };
  return writeNext(0);
}

function storageGetChunked(baseKey){
  return storageGet(baseKey+'__meta').then(function(metaRes){
    if(!metaRes || !metaRes.value) return null;
    var meta;
    try{ meta = JSON.parse(metaRes.value); }catch(e){ return null; }
    var parts = [];
    var readNext = function(idx){
      if(idx>=meta.count) return Promise.resolve(parts.join(''));
      return storageGet(baseKey+'__chunk'+idx).then(function(res){
        parts.push(res && res.value ? res.value : '');
        return readNext(idx+1);
      });
    };
    return readNext(0);
  });
}

/* ---------------------------- SUPABASE STORAGE (foto/dokumen) ----------------------------
   Kalau BACKEND==='supabase', file diunggah langsung ke Supabase Storage
   (satu request, dapat URL publik) — jauh lebih cepat daripada dipecah-pecah
   ke banyak baris seperti pada backend Google Sheets. */
function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(',');
  var meta = parts[0];
  var isBase64 = meta.indexOf('base64')!==-1;
  var mimeMatch = meta.match(/data:([^;]+)/);
  var mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  var raw = isBase64 ? atob(parts[1]) : decodeURIComponent(parts[1]);
  var arr = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++){ arr[i] = raw.charCodeAt(i); }
  return new Blob([arr], {type:mime});
}

function uploadFileToSupabase(path, dataUrl, contentType){
  var blob = dataUrlToBlob(dataUrl);
  var url = SUPABASE_URL+'/storage/v1/object/'+SUPABASE_BUCKET+'/'+path;
  return fetch(url, {
    method:'POST',
    headers: supabaseHeaders({'Content-Type': contentType||blob.type||'application/octet-stream', 'x-upsert':'true'}),
    body: blob
  }).then(function(res){
    if(!res.ok) throw new Error('Upload gagal: HTTP '+res.status);
    return SUPABASE_URL+'/storage/v1/object/public/'+SUPABASE_BUCKET+'/'+path;
  });
}

/* ---------------------------- IMAGE COMPRESSION ---------------------------- */
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL('image/jpeg', quality||0.6));
      };
      img.onerror = function(){ reject(new Error('Gagal memuat gambar.')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Gagal membaca file.')); };
    reader.readAsDataURL(file);
  });
}

function readFileAsDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){ resolve(e.target.result); };
    reader.onerror = function(){ reject(new Error('Gagal membaca file.')); };
    reader.readAsDataURL(file);
  });
}

function haversineMeters(lat1, lng1, lat2, lng2){
  var R = 6371000;
  var toRad = function(d){ return d*Math.PI/180; };
  var dLat = toRad(lat2-lat1);
  var dLng = toRad(lng2-lng1);
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
  var c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}

function matchOfficeLocation(loc){
  if(!loc || loc.lat==null || loc.lat===undefined) return null;
  var locations = DB.officeLocations || [];
  if(locations.length===0) return null;
  var best = null, bestDist = Infinity;
  locations.forEach(function(o){
    var d = haversineMeters(loc.lat, loc.lng, o.lat, o.lng);
    if(d < bestDist){ bestDist = d; best = o; }
  });
  if(!best) return null;
  return {name:best.name, address:best.address, distance:Math.round(bestDist), withinRange: bestDist <= (best.radius||150)};
}

function mapsLink(loc){

function osmEmbedHtml(loc, height){

  var d = 0.003;
  var bbox = (loc.lng-d)+','+(loc.lat-d)+','+(loc.lng+d)+','+(loc.lat+d);
  var src = 'https://www.openstreetmap.org/export/embed.html?bbox='+bbox+'&marker='+loc.lat+','+loc.lng+'&layer=mapnik';
  return '<iframe src="'+src+'" style="width:100%;height:'+(height||160)+'px;border:1px solid var(--border);border-radius:16px;margin-top:10px;" loading="lazy"></iframe>';
}

/* loadDB() SENGAJA TIDAK PERNAH menyimpan (saveDB) kalau pengambilan data
   dari server gagal (error jaringan/HTTP/dsb). Sebelumnya, kegagalan
   pengambilan data jatuh ke DB kosong (seedData) dan langsung disimpan
   ulang ke server -- ini menimpa/menghapus data asli yang sudah ada di
   server hanya karena koneksi sempat terputus sesaat. Sekarang: kalau
   server TIDAK bisa dihubungi, aplikasi berhenti di layar "Coba Lagi"
   dan TIDAK menulis apa pun sampai berhasil membaca data yang sebenarnya. */
function loadDB(){
  STATE.loadError = false;
  if(hasRemoteStorage()){
    return remoteGet('hrdb').then(function(res){
      STORAGE_MODE = BACKEND==='supabase' ? 'remote-supabase' : 'remote-appsscript';
      if(res && res.value){
        try{ DB = JSON.parse(res.value); }
        catch(e){ DB = seedData(); }
      } else {
        DB = seedData();
      }
      runDBMigrations();
      STATE.loaded = true;
      STATE.loadError = false;
      return saveDB(true);
    }).catch(function(err){
      console.error('Gagal memuat data dari server -- TIDAK menyimpan apa pun supaya data asli di server tidak tertimpa.', err);
      STATE.loaded = false;
      STATE.loadError = true;
      STATE.loadErrorDetail = String((err && err.message) || err || '');
    });
  }
  return fallbackGet('hrdb').then(function(res){
    if(res && res.value){
      try{ DB = JSON.parse(res.value); } catch(e){ DB = seedData(); }
    } else {
      DB = seedData();
    }
    runDBMigrations();
    STATE.loaded = true;
    STATE.loadError = false;
    return saveDB(true);
  }).catch(function(err){
    console.error('Gagal memuat data lokal', err);
    DB = seedData();
    runDBMigrations();
    STATE.loaded = true;
    STATE.loadError = false;
    return saveDB(true);
  });
}

function saveDB(silent){
  if(STATE.loadError){
    if(!silent) toast('Tidak bisa menyimpan: data belum berhasil dimuat dari server. Muat ulang halaman dan coba lagi.');
    return Promise.reject(new Error('Menolak menyimpan karena loadDB terakhir gagal (loadError).'));
  }
  return storageSet('hrdb', JSON.stringify(DB)).catch(function(){
    if(!silent) toast('Gagal menyimpan data.');
  });
}

  return getKpiDefinitions(dept).reduce(function(sum, k){ return sum + (Number(k.weight)||0); }, 0);

function calcPencapaian(direction, target, realisasi){
  if(realisasi===null || realisasi===undefined || realisasi==='') return null;
  realisasi = Number(realisasi);
  target = Number(target)||0;
  if(direction==='min'){
    if(target===0) return realisasi===0 ? 1 : 0;
    if(realisasi===0) return 1;
    return target / realisasi;
  }
  if(target===0) return 1;
  return realisasi / target;
}
function kpiStatusForPencapaian(p){
  if(p===null) return null;
  if(p>=1) return 'tercapai';
  if(p>=0.8) return 'mendekati';
  return 'perhatian';
}
function calcKpiRecordTotals(record){
  var total = 0;
  record.items.forEach(function(it){
    var p = calcPencapaian(it.direction, it.target, it.realisasi);
    it.pencapaian = p;
    it.skorTertimbang = p===null ? null : p * (Number(it.weight)||0);
    it.status = kpiStatusForPencapaian(p);
    if(it.skorTertimbang!==null) total += it.skorTertimbang;
  });
  record.totalScore = total;
  record.totalStatus = kpiStatusForPencapaian(total);
  return record;
}

      realisasi: prev ? prev.realisasi : null

  });
}

function getMatchDay(empId, ym, day){
  var sched = DB.schedules[ym] && DB.schedules[ym][empId] ? DB.schedules[ym][empId][day] : null;
  var att = DB.attendance[ym] && DB.attendance[ym][empId] ? DB.attendance[ym][empId][day] : null;

  if(!sched){
    return {status:'unset', sched:null, att:att, lateMinutes:0};
  }
  if(sched.type==='libur'){
    if(att && att.checkIn){
      return {status:'lembur', sched:sched, att:att, lateMinutes:0};
    }
    if(sched.cuti){
      return {status:'cuti', sched:sched, att:att, lateMinutes:0};
    }
    return {status:'libur', sched:sched, att:att, lateMinutes:0};
  }
  // kerja
  if(!att || !att.checkIn){
    var today = new Date(); today.setHours(0,0,0,0);
    var thisDay = new Date(ymParts(ym).y, ymParts(ym).m-1, day);
    if(thisDay.getTime() > today.getTime()){
      return {status:'akan_datang', sched:sched, att:att, lateMinutes:0};
    }
    return {status:'alpha', sched:sched, att:att, lateMinutes:0};
  }
  var startMin = timeToMinutes(sched.start);
  var grace = DB.settings.gracePeriodMinutes || 0;
  var inMin = timeToMinutes(att.checkIn);
  var lateBy = inMin - startMin - grace;
  if(lateBy > 0){
    return {status:'telat', sched:sched, att:att, lateMinutes:lateBy};
  }
  return {status:'hadir', sched:sched, att:att, lateMinutes:0};
}

function getMonthSummary(empId, ym){
  var n = daysInMonth(ym);
  var days = [];
  var totals = {hadir:0, telat:0, alpha:0, libur:0, lembur:0, unset:0, akan_datang:0, cuti:0, totalLateMinutes:0};
  for(var d=1; d<=n; d++){
    var m = getMatchDay(empId, ym, d);
    m.day = d;
    m.weekday = weekdayOf(ym, d);
    days.push(m);
    if(totals[m.status] !== undefined) totals[m.status]++;
    totals.totalLateMinutes += (m.lateMinutes||0);
  }
  return {days:days, totals:totals};
}

function computePayroll(empId, ym){
  var emp = getEmployee(empId);
  if(!emp) return null;
  var summary = getMonthSummary(empId, ym);
  var settings = DB.settings;
  var lateDeduction = summary.totals.totalLateMinutes * (settings.lateRatePerMinute||0);
  if(settings.lateDeductionCap && settings.lateDeductionCap>0 && lateDeduction > settings.lateDeductionCap){
    lateDeduction = settings.lateDeductionCap;
  }
  var mealAllowance = Number(emp.mealAllowance)||0;
  var transportAllowance = Number(emp.transportAllowance)||0;
  var allowances = (DB.otherAllowances[ym] && DB.otherAllowances[ym][empId]) || [];
  var allowancesTotal = allowances.reduce(function(s,a){ return s + (Number(a.amount)||0); }, 0);
  var grossEarnings = emp.baseSalary + mealAllowance + transportAllowance + allowancesTotal;
  var bpjsKes = emp.bpjsKesehatanActive!==false ? Math.round(emp.baseSalary * (settings.bpjsKesehatanPct||0)/100) : 0;
  var bpjsTK = emp.bpjsKetenagakerjaanActive!==false ? Math.round(emp.baseSalary * (settings.bpjsKetenagakerjaanPct||0)/100) : 0;
  var others = (DB.otherDeductions[ym] && DB.otherDeductions[ym][empId]) || [];
  var othersTotal = others.reduce(function(s,o){ return s + (Number(o.amount)||0); }, 0);
  var totalDeduction = lateDeduction + bpjsKes + bpjsTK + othersTotal;
  var thp = grossEarnings - totalDeduction;
  return {
    emp:emp, ym:ym, summary:summary,
    mealAllowance:mealAllowance, transportAllowance:transportAllowance,
    allowances:allowances, allowancesTotal:allowancesTotal, grossEarnings:grossEarnings,

function afterRender(){
  var npanel = document.querySelector('.notif-panel');
  if(npanel && window.innerWidth<=860){
    var nbell = document.querySelector('.notif-bell-btn');
    if(nbell){ npanel.style.top = Math.round(nbell.getBoundingClientRect().bottom + 10)+'px'; }
  }
  if(SESSION.role && fcmAvailable()){ if(!STATE.fcmInited) fcmInit(); else fcmSyncRecipient(); }
  hydrateBannerImages();
  hydrateAvatars();
  hydrateImages();
  if(SESSION.role){
    if(STATE.view==='chat') chatScrollToEnd();
    if(STATE.loaded && !CHAT.loaded) chatPoll();
    updateNavChatBadge();
  }
  var onCheckin = SESSION.role && STATE.view==='checkin';
  if(!onCheckin){
    stopCameraStream();
    return;
  }
  var videoEl = document.getElementById('checkinVideo');
  if(!videoEl){
    /* no camera UI showing right now (already captured, error state, or absen already lengkap) */
    return;
  }
  if(CHECKIN_STREAM){
    try{ videoEl.srcObject = CHECKIN_STREAM; }catch(e){}
  } else if(CHECKIN_CAMERA_STATUS==='idle'){
    startCameraStream();
  }
}

/* ---------------------------- RENDER: ADMIN DASHBOARD ---------------------------- */
function departmentKpiAverages(period){
  var byDept = {};
  (DB.kpiRecords||[]).filter(function(r){ return r.status==='approved' && r.period===period; }).forEach(function(r){
    calcKpiRecordTotals(r);
    byDept[r.department] = byDept[r.department] || [];
    byDept[r.department].push(r.totalScore);
  });
  return Object.keys(byDept).map(function(d){
    var arr = byDept[d];
    var avg = arr.reduce(function(s,v){ return s+v; },0) / arr.length;
    return {label:d, value:avg};
  }).sort(function(a,b){ return b.value - a.value; });
}

function teamKpiScores(team, period){
  var out = [];
  team.forEach(function(e){
    var r = getKpiRecord(e.id, period);
    if(!r) return;
    calcKpiRecordTotals(r);
    out.push({label:e.name, value:r.totalScore, statusKey:kpiStatusForPencapaian(r.totalScore)});
  });
  return out.sort(function(a,b){ return b.value - a.value; });
}

function renderAdminDashboard(){
  var ym = STATE.currentMonth;

  var totalPayroll = 0, totalLateMin = 0, totalLateDeduction = 0;
  var perEmp = emps.map(function(e){
    var p = computePayroll(e.id, ym);
    totalPayroll += p.thp;
    totalLateMin += p.summary.totals.totalLateMinutes;
    totalLateDeduction += p.lateDeduction;
    return {emp:e, p:p};
  });
  perEmp.sort(function(a,b){ return b.p.summary.totals.totalLateMinutes - a.p.summary.totals.totalLateMinutes; });
  var maxLate = Math.max(1, perEmp[0] ? perEmp[0].p.summary.totals.totalLateMinutes : 1);
  var pendingLeave = DB.leaveRequests.filter(function(r){ return r.status==='pending_hr'; }).length;
  var pendingKpi = (DB.kpiRecords||[]).filter(function(r){ return r.status==='pending_hr'; }).length;

    '<div class="card-sub">'+monthLabel(ym)+' &middot; diurutkan dari yang paling sering telat</div>'+

function renderHodAttendancePage(){
  var myDepts = getHodDepartments(SESSION.empId);
  if(myDepts.length===0){
    return '<div class="card"><div class="empty-state">Anda belum ditunjuk sebagai HOD departemen mana pun.</div></div>';
  }
  var t = todayParts();
  var team = getTeamForHod(SESSION.empId);

  var filterDept = STATE.hodAttFilterDept;
  var filterProp = STATE.hodAttFilterProp;
  var filterName = (STATE.hodAttFilterName||'').toLowerCase();

  var filtered = team.filter(function(e){
    if(filterDept && e.department !== filterDept) return false;
    if(filterProp && (!e.properties || e.properties.indexOf(filterProp)===-1)) return false;
    if(filterName && e.name.toLowerCase().indexOf(filterName)===-1) return false;
    return true;
  });

  var counts = {hadir:0, telat:0, alpha:0, cuti:0, libur:0, akan_datang:0, lembur:0};
  var rows = filtered.map(function(e){
    var m = getMatchDay(e.id, t.ym, t.day);
    if(counts[m.status]!==undefined) counts[m.status]++;
    var meta = STATUS_META[m.status];
    var schedTxt = !m.sched ? '<span class="muted">&mdash;</span>' : (m.sched.type==='kerja' ? m.sched.start+'&ndash;'+m.sched.end : (m.sched.cuti?'Cuti':'Libur'));
    var propsTxt = (e.properties && e.properties.length) ? e.properties.join(', ') : '<span class="muted">&mdash;</span>';
    var hasProof = m.att && (m.att.checkInHasPhoto || m.att.checkOutHasPhoto || m.att.checkInLoc || m.att.checkOutLoc || m.att.checkOutNote);
    return '<tr>'+
      '<td>'+escapeHtml(e.name)+'</td>'+
      '<td>'+escapeHtml(e.department)+'</td>'+
      '<td style="font-size:12.5px;">'+propsTxt+'</td>'+
      '<td>'+schedTxt+'</td>'+
      '<td>'+(m.att&&m.att.checkIn ? m.att.checkIn+' &ndash; '+(m.att.checkOut||'&mdash;') : '&mdash;')+'</td>'+
      '<td><span class="badge '+meta.cls+'">'+meta.label+'</span></td>'+
      '<td>'+(hasProof ? '<button class="btn btn-ghost btn-sm" data-action="view-attendance-proof" data-emp="'+e.id+'" data-ym="'+t.ym+'" data-day="'+t.day+'">Lihat</button>' : '<span class="muted">&mdash;</span>')+'</td>'+
    '</tr>';
  }).join('');

  var deptOptions = '<option value="">Semua Departemen Saya</option>'+myDepts.map(function(d){
    return '<option value="'+d+'" '+(filterDept===d?'selected':'')+'>'+d+'</option>';
  }).join('');
  var propOptions = '<option value="">Semua Properti</option>'+getProperties().map(function(p){
    return '<option value="'+p+'" '+(filterProp===p?'selected':'')+'>'+p+'</option>';
  }).join('');

  return ''+
  '<div class="card">'+
    '<div class="card-title">Ringkasan Hari Ini &mdash; '+formatDateID(t.iso)+'</div>'+
    '<div class="grid grid-4">'+
      '<div class="stat-card"><div class="label">Hadir</div><div class="value">'+counts.hadir+'</div></div>'+
      '<div class="stat-card"><div class="label">Telat</div><div class="value">'+counts.telat+'</div></div>'+
      '<div class="stat-card"><div class="label">Alpha</div><div class="value">'+counts.alpha+'</div></div>'+
      '<div class="stat-card"><div class="label">Cuti / Libur</div><div class="value">'+(counts.cuti+counts.libur)+'</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="toolbar"><div class="toolbar-left" style="flex-wrap:wrap;">'+
    '<select id="hodAttFilterDept" style="padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface-container-low);font-weight:600;">'+deptOptions+'</select>'+
    '<select id="hodAttFilterProp" style="padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface-container-low);font-weight:600;">'+propOptions+'</select>'+
    '<input type="text" id="hodAttFilterName" placeholder="Cari nama&hellip;" value="'+escapeHtml(STATE.hodAttFilterName||'')+'" style="padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface-container-low);font-weight:600;min-width:160px;">'+
  '</div></div>'+
  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Departemen</th><th>Properti</th><th>Jadwal</th><th>Jam Masuk&ndash;Pulang</th><th>Status</th><th>Bukti</th></tr></thead>'+
  '<tbody>'+(rows || '<tr><td colspan="7" class="empty-state">Tidak ada staf yang cocok dengan filter.</td></tr>')+'</tbody></table></div></div>'+
  renderHodAttendanceMonthlyDetail(team);
}

      '<td>'+(hasProof ? '<button class="btn btn-ghost btn-sm" data-action="view-attendance-proof" data-emp="'+empId+'" data-ym="'+ym+'" data-day="'+d+'">Lihat</button>' : '<span class="muted">&mdash;</span>')+'</td>'+

function renderKpiScoreCard(empId, period, editableIfAllowed){
  var emp = getEmployee(empId);
  if(!emp) return '';
  var record = getKpiRecord(empId, period);
  if(record) calcKpiRecordTotals(record);
  var editable = editableIfAllowed && canEditKpiRecord(record);
  var draft = editable ? getKpiFillDraft(empId, period) : null;
  var items = record ? record.items : buildKpiRecordItemsFromCatalog(emp.department, null);
  if(editable){
    items = items.map(function(it){
      var v = draft.values[it.kpiId];
      return Object.assign({}, it, {realisasi: v===undefined ? it.realisasi : v});
    });
  }

  var lastCategory = '\u0000';
  var rows = '';
  items.forEach(function(it, idx){
    if((it.category||'') !== lastCategory){
      lastCategory = it.category||'';
      if(it.category) rows += '<tr><td colspan="9" class="kpi-cat-header">'+escapeHtml(it.category)+'</td></tr>';
    }
    var p = editable ? calcPencapaian(it.direction, it.target, it.realisasi) : it.pencapaian;
    var skor = p===null||p===undefined ? null : p*(Number(it.weight)||0);
    var statusKey = kpiStatusForPencapaian(p);
    var statusMeta = statusKey ? KPI_STATUS_META[statusKey] : null;
    rows += '<tr>'+
      '<td>'+escapeHtml(it.name)+(it.definition?'<div class="muted" style="font-size:11px;">'+escapeHtml(it.definition)+'</div>':'')+'</td>'+
      '<td style="font-size:12px;">'+escapeHtml(it.unit||'-')+'</td>'+
      '<td>'+(it.direction==='max'?'Maks':'Min')+'</td>'+
      '<td class="num">'+(Math.round(it.weight*1000)/10)+'%</td>'+
      '<td class="num">'+it.target+'</td>'+
      '<td>'+(editable ? '<input type="number" step="any" class="kpi-realisasi-input" data-role="kpi-realisasi" data-kpi-id="'+it.kpiId+'" value="'+(it.realisasi!=null?it.realisasi:'')+'" style="width:92px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;">' : (it.realisasi!=null?it.realisasi:'<span class="muted">&mdash;</span>'))+'</td>'+
      '<td class="num">'+kpiPercentText(p)+'</td>'+
      '<td class="num">'+(skor===null?'-':(Math.round(skor*1000)/10)+'%')+'</td>'+
      '<td>'+(statusMeta?'<span class="badge '+statusMeta.cls+'">'+statusMeta.label+'</span>':'<span class="muted">&mdash;</span>')+'</td>'+
    '</tr>';
  });

  var totalScore = editable ? items.reduce(function(s,it){ var p=calcPencapaian(it.direction,it.target,it.realisasi); return s+(p===null?0:p*(Number(it.weight)||0)); },0) : (record?record.totalScore:0);
  var totalStatusKey = kpiStatusForPencapaian(totalScore);
  var totalMeta = totalStatusKey ? KPI_STATUS_META[totalStatusKey] : null;

  var recordStatusBadge = record ? '<span class="badge '+(KPI_RECORD_STATUS_META[record.status]||{}).cls+'">'+(KPI_RECORD_STATUS_META[record.status]||{}).label+'</span>' : '<span class="badge badge-neutral">Belum Diisi</span>';

  var lockNote = '';
  if(!editable && record){
    if(record.status==='pending_hr') lockNote = '<div class="card-sub" style="color:var(--warning);">Sedang menunggu persetujuan HR &mdash; tidak bisa diubah sampai diputuskan.</div>';
    else if(record.status==='approved') lockNote = '<div class="card-sub" style="color:var(--success);">Sudah disetujui HR untuk periode ini.</div>';
  }
  if(record && record.status==='rejected' && record.hrNote){
    lockNote += '<div class="card-sub" style="color:var(--danger);">Catatan penolakan HR: '+escapeHtml(record.hrNote)+'</div>';
  }

  var actionButtons = '';
  if(editable){
    actionButtons = ''+
      '<button class="btn btn-secondary" data-action="save-kpi-draft" data-emp="'+empId+'" data-period="'+period+'">Simpan Sementara</button> '+
      '<button class="btn btn-primary" data-action="submit-kpi-record" data-emp="'+empId+'" data-period="'+period+'">Ajukan ke HR</button>';
  }

  return ''+
  '<div class="card">'+
    '<div class="card-title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">'+
      '<span>KPI &mdash; '+escapeHtml(emp.name)+' &middot; '+monthLabel(period)+'</span>'+recordStatusBadge+
    '</div>'+
    lockNote+
    '<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>KPI</th><th>Satuan</th><th>Arah</th><th class="num">Bobot</th><th class="num">Target</th><th>Realisasi</th><th class="num">Pencapaian</th><th class="num">Skor</th><th>Status</th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="9" class="empty-state">Belum ada indikator KPI untuk departemen ini. Klik "Kelola KPI Departemen Ini" untuk menambahkan.</td></tr>')+'</tbody>'+
    '<tfoot><tr style="font-weight:700;"><td colspan="7" style="text-align:right;">TOTAL SKOR KPI</td><td class="num">'+(Math.round(totalScore*1000)/10)+'%</td><td>'+(totalMeta?'<span class="badge '+totalMeta.cls+'">'+totalMeta.label+'</span>':'-')+'</td></tr></tfoot>'+
    '</table></div>'+
    (actionButtons ? '<div style="margin-top:14px;">'+actionButtons+'</div>' : '')+
    (record && (record.fileKey||true) ? '<div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" data-action="download-kpi-pdf" data-emp="'+empId+'" data-period="'+period+'">Unduh PDF</button></div>' : '')+
  '</div>';
}

function renderSchedulePage(){
  var ym = STATE.currentMonth;
  var myDepts = getHodDepartments(SESSION.empId);
  if(myDepts.length===0){
    return '<div class="card"><div class="empty-state">Anda belum ditunjuk sebagai HOD departemen mana pun. Minta HR mengatur lewat halaman Karyawan &rarr; "Kelola HOD".</div></div>';
  }
  if(!STATE.selectedHodDepartment || myDepts.indexOf(STATE.selectedHodDepartment)===-1){
    STATE.selectedHodDepartment = myDepts[0];
  }
  var dept = STATE.selectedHodDepartment;
  var deptEmployees = activeEmployees().filter(function(e){ return e.department===dept; });

  var deptSelector = myDepts.length > 1 ? (
    '<div class="toolbar" style="margin-top:0;"><div class="toolbar-left">'+
      '<label class="muted" style="font-size:12.5px;">Departemen:</label>'+
      '<select id="hodDeptSelect" style="padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface-container-low);font-weight:600;">'+
        myDepts.map(function(d){ return '<option value="'+d+'" '+(d===dept?'selected':'')+'>'+d+'</option>'; }).join('')+
      '</select>'+
    '</div></div>'
  ) : '';

  if(deptEmployees.length===0){
    return deptSelector+'<div class="card"><div class="empty-state">Belum ada karyawan aktif di departemen '+escapeHtml(dept)+'.</div></div>';
  }

  var approval = getScheduleApproval(dept, ym);
  var approvalMeta = approval ? (SCHEDULE_APPROVAL_META[approval.status] || SCHEDULE_APPROVAL_META.pending) : null;

  if(!STATE.patternDraft) STATE.patternDraft = defaultWeekPattern();
  var patternRows = WEEK_PATTERN_ROWS.map(function(r){
    var p = STATE.patternDraft[r.wd];
    var isKerja = p.type==='kerja';
    return '<tr>'+
      '<td>'+r.label+'</td>'+
      '<td><select data-role="pattern-type" data-wd="'+r.wd+'">'+
        '<option value="kerja" '+(isKerja?'selected':'')+'>Kerja</option>'+
        '<option value="libur" '+(!isKerja?'selected':'')+'>Libur</option>'+
      '</select></td>'+

/* ---------------------------- SPREADSHEET IMPORT (HR) ---------------------------- */
function findEmployeeByName(name){
  if(!name) return null;
  var n = String(name).trim().toLowerCase();
  if(!n) return null;
  var exact = DB.employees.find(function(e){ return e.name.trim().toLowerCase()===n; });
  if(exact) return exact;
  return DB.employees.find(function(e){
    var en = e.name.trim().toLowerCase();
    return n.indexOf(en)!==-1 || en.indexOf(n)!==-1;
  }) || null;
}

function excelValueToTime(v){
  if(v===null || v===undefined || v==='') return null;
  if(Object.prototype.toString.call(v)==='[object Date]' && !isNaN(v)){
    return pad2(v.getHours())+':'+pad2(v.getMinutes());
  }
  if(typeof v === 'number'){
    var totalMinutes = Math.round((v % 1) * 24 * 60);
    if(totalMinutes<=0) return null;
    return pad2(Math.floor(totalMinutes/60))+':'+pad2(totalMinutes%60);
  }
  var s = String(v).trim();
  var m = s.match(/(\d{1,2}):(\d{2})/);
  if(m) return pad2(parseInt(m[1],10)%24)+':'+m[2];
  return null;
}

function excelValueToDayInfo(v, fallbackYm){
  if(v===null || v===undefined || v==='') return null;
  if(Object.prototype.toString.call(v)==='[object Date]' && !isNaN(v)){
    return {y:v.getFullYear(), m:v.getMonth()+1, d:v.getDate()};
  }
  var s = String(v).trim();
  if(s.indexOf('-')!==-1 || s.indexOf('/')!==-1){
    var norm = s.replace(/\//g,'-');
    var parts = norm.split('-');
    if(parts.length===3){
      var a = parseInt(parts[0],10), b = parseInt(parts[1],10), c = parseInt(parts[2],10);
      if(parts[0].length===4) return {y:a, m:b, d:c};
      return {y:c, m:b, d:a};
    }
  }
  var day = parseInt(s,10);
  if(!isNaN(day) && day>=1 && day<=31){
    var p = ymParts(fallbackYm);
    return {y:p.y, m:p.m, d:day};
  }
  return null;
}

function downloadAttendanceTemplate(){
  if(!window.XLSX){ toast('Modul spreadsheet belum siap, coba lagi beberapa saat.'); return; }
  var ym = STATE.currentMonth;
  var n = daysInMonth(ym);
  var rows = [['Nama Karyawan','Tanggal','Jam Masuk','Jam Pulang']];
  activeEmployees().forEach(function(e){
    for(var d=1; d<=n; d++){
      rows.push([e.name, ym+'-'+pad2(d), '', '']);
    }
  });
  try{
    var ws = window.XLSX.utils.aoa_to_sheet(rows);
    var wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'Absensi');
    window.XLSX.writeFile(wb, 'Template-Absensi-'+ym+'.xlsx');
  }catch(e){
    toast('Gagal membuat template.');
  }
}

function importAttendanceSpreadsheet(file){
  if(!window.XLSX){ toast('Modul spreadsheet belum siap, coba lagi beberapa saat.'); return; }
  var statusEl = document.getElementById('importSpreadsheetStatus');
  if(statusEl) statusEl.textContent = 'Membaca file...';
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = new Uint8Array(ev.target.result);
      var wb = window.XLSX.read(data, {type:'array', cellDates:true});
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var rows = window.XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      var imported = 0, skipped = 0;
      rows.forEach(function(row){
        if(!row || row.length < 3) { return; }
        var emp = findEmployeeByName(row[0]);
        if(!emp){ skipped++; return; }
        var dayInfo = excelValueToDayInfo(row[1], STATE.currentMonth);
        if(!dayInfo){ skipped++; return; }
        var ym = dayInfo.y+'-'+pad2(dayInfo.m);
        var checkIn = excelValueToTime(row[2]);
        var checkOut = row.length>3 ? excelValueToTime(row[3]) : null;
        if(!checkIn){ skipped++; return; }
        DB.attendance[ym] = DB.attendance[ym] || {};
        DB.attendance[ym][emp.id] = DB.attendance[ym][emp.id] || {};
        DB.attendance[ym][emp.id][dayInfo.d] = {checkIn:checkIn, checkOut:checkOut};
        imported++;
      });
      saveDB().then(function(){
        closeModal();
        toast(imported+' baris absensi diimpor'+(skipped?', '+skipped+' baris dilewati':'')+'.');
        render();
      });
    }catch(err){
      console.error(err);
      if(statusEl) statusEl.textContent = 'Gagal membaca file. Pastikan formatnya sesuai template.';
      else toast('Gagal membaca file. Pastikan formatnya sesuai template.');
    }
  };
  reader.onerror = function(){
    if(statusEl) statusEl.textContent = 'Gagal membaca file.';
  };
  reader.readAsArrayBuffer(file);
}

function renderPayrollPage(){
  var ym = STATE.currentMonth;
  var filterDept = STATE.payrollFilterDept || '';
  var filterName = (STATE.payrollFilterName||'').toLowerCase();
  var emps = activeEmployees().filter(function(e){
    if(filterDept && e.department !== filterDept) return false;
    if(filterName && e.name.toLowerCase().indexOf(filterName)===-1) return false;
    return true;
  });
  var rows = emps.map(function(e){
    var p = computePayroll(e.id, ym);
    return '<tr>'+
      '<td>'+escapeHtml(e.name)+'<div class="muted" style="font-size:11.5px;">'+escapeHtml(e.position)+' &middot; '+escapeHtml(e.department)+'</div></td>'+
      '<td class="num">'+rupiah(e.baseSalary)+'</td>'+
      '<td class="num">'+rupiah(p.allowancesTotal)+'</td>'+
      '<td class="num">'+rupiah(p.bpjsKes)+'</td>'+
      '<td class="num">'+rupiah(p.bpjsTK)+'</td>'+
      '<td class="num">'+rupiah(p.lateDeduction)+'</td>'+
      '<td class="num">'+rupiah(p.othersTotal)+'</td>'+
      '<td class="num"><strong>'+rupiah(p.thp)+'</strong></td>'+
      '<td><button class="btn btn-ghost btn-sm" data-action="open-payroll-detail" data-emp="'+e.id+'">Detail / Slip</button></td>'+
    '</tr>';
  }).join('');

  var totalThp = emps.reduce(function(s,e){ return s + computePayroll(e.id, ym).thp; }, 0);

  var deptOptions = '<option value="">Semua Departemen</option>'+getDepartments().map(function(d){
    return '<option value="'+escapeHtml(d)+'" '+(filterDept===d?'selected':'')+'>'+escapeHtml(d)+'</option>';
  }).join('');

  return ''+
  '<div class="toolbar"><div class="toolbar-left" style="flex-wrap:wrap;">'+
    '<select id="payrollFilterDept" style="padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface-container-low);font-weight:600;">'+deptOptions+'</select>'+
    '<input type="text" id="payrollFilterName" placeholder="Cari nama staf&hellip;" value="'+escapeHtml(STATE.payrollFilterName||'')+'" style="padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface-container-low);font-weight:600;min-width:180px;">'+
  '</div></div>'+
  '<div class="card">'+
    '<div class="card-title">Ringkasan Penggajian</div>'+
    '<div class="card-sub">'+monthLabel(ym)+' &middot; Total Take Home Pay (sesuai filter): <strong>'+rupiah(totalThp)+'</strong></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Karyawan</th><th class="num">Gaji Pokok</th><th class="num">Tunj. Lain</th><th class="num">BPJS Kes.</th><th class="num">BPJS TK</th><th class="num">Pot. Telat</th><th class="num">Pot. Lain</th><th class="num">Take Home Pay</th><th>Aksi</th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="9" class="empty-state">Tidak ada karyawan yang cocok dengan filter.</td></tr>')+'</tbody></table></div>'+
  '</div>';
}
