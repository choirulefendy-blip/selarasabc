function renderCheckinPage(){
  var empId = SESSION.empId;
  var now = new Date();
  var ym = now.getFullYear()+'-'+pad2(now.getMonth()+1);
  var day = now.getDate();
  var att = (DB.attendance[ym] && DB.attendance[ym][empId] && DB.attendance[ym][empId][day]) || null;
  var hasIn = att && att.checkIn;
  var hasOut = att && att.checkOut;

  if(CHECKIN_DRAFT.locationStatus === 'idle'){
    CHECKIN_DRAFT.locationStatus = 'loading';
    getLocationOnce().then(function(loc){
      CHECKIN_DRAFT.location = loc;
      CHECKIN_DRAFT.locationStatus = loc ? 'ok' : 'unavailable';
      render();
    });
  }

  var locText = CHECKIN_DRAFT.locationStatus==='loading' ? 'Mengambil lokasi...' :
    CHECKIN_DRAFT.locationStatus==='ok' ? ('Lokasi terdeteksi (akurasi &plusmn;'+Math.round(CHECKIN_DRAFT.location.accuracy||0)+' m).') :
    'Lokasi tidak tersedia &mdash; tetap bisa absen tanpa lokasi.';

  var geoMatch = CHECKIN_DRAFT.locationStatus==='ok' ? matchOfficeLocation(CHECKIN_DRAFT.location) : null;
  var geoMatchHtml = '';
  if(geoMatch){
    geoMatchHtml = ''+
    '<div class="geo-match-box '+(geoMatch.withinRange?'geo-ok':'geo-warn')+'">'+
      '<div class="geo-match-title">'+(geoMatch.withinRange ? '&#10003; Dalam jangkauan &mdash; '+escapeHtml(geoMatch.name) : '&#9888; Di luar jangkauan &mdash; terdekat '+escapeHtml(geoMatch.name)+' ('+geoMatch.distance+' m)')+'</div>'+
      '<div class="geo-match-address">'+escapeHtml(geoMatch.address)+'</div>'+
    '</div>';
  }

  var summaryCard = ''+
  '<div class="card">'+
    '<div class="card-title">Absensi Hari Ini</div>'+
    '<div class="card-sub">'+formatDateID(todayISO())+'</div>'+
    '<div class="grid grid-2">'+
      '<div class="stat-card"><div class="label">Jam Masuk</div><div class="value" style="font-size:20px;">'+(hasIn?att.checkIn:'&mdash;')+'</div>'+(hasIn&&att.checkInHasPhoto?'<div class="sub">Foto &amp; lokasi tersimpan</div>':'')+'</div>'+
      '<div class="stat-card"><div class="label">Jam Pulang</div><div class="value" style="font-size:20px;">'+(hasOut?att.checkOut:'&mdash;')+'</div>'+(hasOut&&att.checkOutHasPhoto?'<div class="sub">Foto &amp; lokasi tersimpan</div>':'')+'</div>'+
    '</div>'+
  '</div>';

  var actionCard;
  if(!hasIn){
    actionCard = renderCheckinActionCard('in', 'Absen Masuk', locText, geoMatchHtml);
  } else if(!hasOut){
    actionCard = renderCheckinActionCard('out', 'Absen Pulang', locText, geoMatchHtml);
  } else {
    stopCameraStream();
    actionCard = '<div class="card"><div class="empty-state">Absen hari ini sudah lengkap. Sampai jumpa besok!</div></div>';
  }

  return summaryCard + actionCard;
}

function renderKpiApprovalPage(){
  var filterDept = STATE.kpiFilterDept || '';
  var deptOptions = '<option value="">Semua Departemen</option>'+getDepartments().map(function(d){
    return '<option value="'+escapeHtml(d)+'" '+(filterDept===d?'selected':'')+'>'+escapeHtml(d)+'</option>';
  }).join('');

  var catalogDept = filterDept || getDepartments()[0];

  var records = (DB.kpiRecords||[]).filter(function(r){ return r.status==='pending_hr' || r.status==='approved' || r.status==='rejected'; })
    .filter(function(r){ return !filterDept || r.department===filterDept; })
    .slice().sort(function(a,b){
      var rank = function(s){ return s.status==='pending_hr' ? 0 : 1; };
      var rk = rank(a)-rank(b);
      if(rk!==0) return rk;
      return (b.submittedAt||'').localeCompare(a.submittedAt||'');
    });

  var rows = records.map(function(r){
    calcKpiRecordTotals(r);
    var emp = getEmployee(r.empId);
    var meta = KPI_RECORD_STATUS_META[r.status] || KPI_RECORD_STATUS_META.pending_hr;
    return '<tr>'+
      '<td>'+escapeHtml(emp?emp.name:'(karyawan dihapus)')+'</td>'+
      '<td>'+escapeHtml(r.department)+'</td>'+
      '<td>'+monthLabel(r.period)+'</td>'+
      '<td class="num">'+(Math.round(r.totalScore*1000)/10)+'%</td>'+

function calcOvertimeDuration(startTime, endTime){
  if(!startTime || !endTime) return null;
  var sp = startTime.split(':').map(Number);
  var ep = endTime.split(':').map(Number);
  if(sp.length<2 || ep.length<2) return null;
  var startMin = sp[0]*60+sp[1];
  var endMin = ep[0]*60+ep[1];
  var diff = endMin - startMin;
  if(diff < 0) diff += 24*60;
  return Math.round((diff/60)*100)/100;
}

/* ---------------------------- PDF EXPORT ---------------------------- */
function downloadTeamSchedulePDF(){
  if(!window.jspdf){ toast('Modul PDF belum siap, coba lagi beberapa saat.'); return; }
  var ym = STATE.currentMonth;
  var dept = STATE.selectedHodDepartment;
  var emps = dept ? activeEmployees().filter(function(e){ return e.department===dept; }) : activeEmployees();
  if(emps.length===0){ toast('Belum ada karyawan aktif.'); return; }
  var n = daysInMonth(ym);
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({unit:'pt', format:'a4', orientation:'landscape'});
  var pageW = doc.internal.pageSize.getWidth();
  var pageH = doc.internal.pageSize.getHeight();
  var margin = 30;
  var nameColW = 92;
  var usableW = pageW - margin*2 - nameColW;
  var dayColW = usableW / n;
  var headerH = 30;
  var rowH = 20;

  doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(DB.company.name, margin, margin);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  doc.text('Jadwal Kerja Tim'+(dept?' \u2014 '+dept:'')+' \u2014 '+monthLabel(ym), margin, margin+15);
  doc.setTextColor(0);

  var top = margin + 28;
  doc.setDrawColor(200);
  doc.setFillColor(235,233,224);
  doc.rect(margin, top, nameColW, headerH, 'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.text('Nama', margin+6, top+18);

  for(var d=1; d<=n; d++){
    var x = margin+nameColW+(d-1)*dayColW;
    var wd = weekdayOf(ym,d);
    doc.setFillColor(wd===0?222:235, wd===0?222:233, wd===0?222:224);
    doc.rect(x, top, dayColW, headerH, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(7);
    doc.text(String(d), x+dayColW/2, top+13, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(5.3);
    doc.text(DAY_SHORT_ID[wd], x+dayColW/2, top+23, {align:'center'});
  }

  var y = top + headerH;
  emps.forEach(function(e){
    if(y > pageH - 70){
      doc.addPage('a4','landscape');
      y = margin;
    }
    doc.setDrawColor(210);
    doc.setFillColor(255,255,255);
    doc.rect(margin, y, nameColW, rowH, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(0);
    var shortName = e.name.length>17 ? e.name.slice(0,16)+'.' : e.name;
    doc.text(shortName, margin+5, y+13);

    for(var dd=1; dd<=n; dd++){
      var m = getMatchDay(e.id, ym, dd);
      var x2 = margin+nameColW+(dd-1)*dayColW;
      var fill, label;
      if(!m.sched){ fill=[255,255,255]; label='-'; }
      else if(m.sched.cuti){ fill=[204,224,247]; label='C'; }
      else if(m.sched.type==='libur'){ fill=[228,228,222]; label='L'; }
      else { fill=[219,238,229]; label=(m.sched.start||'').slice(0,2); }
      doc.setFillColor(fill[0],fill[1],fill[2]);
      doc.setDrawColor(220);
      doc.rect(x2, y, dayColW, rowH, 'FD');
      doc.setFont('helvetica','normal'); doc.setFontSize(6.3); doc.setTextColor(50);
      doc.text(label, x2+dayColW/2, y+13, {align:'center'});
    }
    y += rowH;
  });

  y += 18;
  if(y > pageH - 20){ doc.addPage('a4','landscape'); y = margin; }
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(80);
  doc.text('Keterangan: angka = jam masuk kerja \u00b7 L = Libur \u00b7 C = Cuti (disetujui) \u00b7 - = Jadwal belum diatur', margin, y);

  doc.save('Jadwal-Tim-'+ym+'.pdf');
  toast('Jadwal tim diunduh.');
}

function downloadKpiRecordPDF(empId, period){
  if(!window.jspdf){ toast('Modul PDF belum siap, coba lagi beberapa saat.'); return; }
  var emp = getEmployee(empId);
  if(!emp) return;
  var record = getKpiRecord(empId, period);
  var items = record ? record.items : buildKpiRecordItemsFromCatalog(emp.department, null);
  if(record) calcKpiRecordTotals(record);
  var totalScore = record ? record.totalScore : 0;
  var totalStatusKey = kpiStatusForPencapaian(totalScore);
  var totalMeta = totalStatusKey ? KPI_STATUS_META[totalStatusKey] : {label:'Belum Diisi'};
  var recordMeta = record ? (KPI_RECORD_STATUS_META[record.status]||{}) : {label:'Belum Diajukan'};

  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({unit:'pt', format:'a4'});
  var left = 36, right = 559, y = 50, pageBottom = 780;

  function ensureSpace(needed){
    if(y + needed > pageBottom){
      doc.addPage();
      y = 50;
      drawColHeader();
    }
  }
  function drawColHeader(){
    doc.setFillColor(238,237,230);
    doc.rect(left, y-11, right-left, 18, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(0);
    doc.text('KPI', left+4, y+2);
    doc.text('Target', left+270, y+2);
    doc.text('Realisasi', left+330, y+2);
    doc.text('Capaian', left+390, y+2);
    doc.text('Skor', left+445, y+2);
    doc.text('Status', left+490, y+2);
    doc.setFont('helvetica','normal');
    y += 18;
  }

  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(DB.company.name, left, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90);
  y += 14; doc.text(DB.company.address, left, y);
  doc.setTextColor(0);
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('LAPORAN KPI KARYAWAN', right, 50, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Periode ' + monthLabel(period), right, 64, {align:'right'});

  y += 12; doc.setDrawColor(18,58,52); doc.setLineWidth(1.2); doc.line(left, y, right, y);
  y += 20;

  doc.setFontSize(9);
  function pair(label, value, yy, xLabel, xValue){
    doc.setTextColor(110); doc.text(label, xLabel, yy);
    doc.setTextColor(0); doc.setFont('helvetica','bold'); doc.text(String(value), xValue, yy);
    doc.setFont('helvetica','normal');
  }
  pair('Nama', emp.name, y, left, left+70);
  pair('ID Karyawan', emp.empCode||emp.id, y, left+280, left+360);
  y += 15;
  pair('Departemen', emp.department, y, left, left+70);
  pair('Status', recordMeta.label, y, left+280, left+360);
  y += 25;

  drawColHeader();
  doc.setFontSize(8);
  var lastCategory = '\u0000';
  items.forEach(function(it){
    if((it.category||'') !== lastCategory){
      lastCategory = it.category||'';
      if(it.category){
        ensureSpace(16);
        doc.setFont('helvetica','bold'); doc.setFillColor(245,244,238);
        doc.rect(left, y-9, right-left, 14, 'F');
        doc.text(it.category, left+4, y+1);
        doc.setFont('helvetica','normal');
        y += 15;
      }
    }
    var p = record ? it.pencapaian : null;
    var skor = record ? it.skorTertimbang : null;
    var statusLabel = record && it.status ? KPI_STATUS_META[it.status].label : '-';
    var nameLines = doc.splitTextToSize(it.name, 260);
    ensureSpace(Math.max(13, nameLines.length*10)+4);
    doc.text(nameLines, left+4, y);
    doc.text(String(it.target), left+270, y);
    doc.text(it.realisasi!=null ? String(it.realisasi) : '-', left+330, y);
    doc.text(kpiPercentText(p), left+390, y);
    doc.text(skor==null?'-':(Math.round(skor*1000)/10)+'%', left+445, y);
    doc.text(statusLabel, left+490, y);
    y += Math.max(13, nameLines.length*10);
    doc.setDrawColor(230); doc.line(left, y-3, right, y-3);
  });

  ensureSpace(30);
  y += 6;
  doc.setFillColor(18,58,52); doc.rect(left, y-13, right-left, 22, 'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('TOTAL SKOR KPI', left+6, y+2);
  doc.text((Math.round(totalScore*1000)/10)+'%  -  '+totalMeta.label, right-6, y+2, {align:'right'});
  doc.setTextColor(0); doc.setFont('helvetica','normal');
  y += 40;

  ensureSpace(60);
  doc.setFontSize(8); doc.setTextColor(120);
  doc.text('Dicetak: '+todayISO()+' - Dokumen dibuat otomatis oleh Sistem HR.', left, y);
  doc.setTextColor(0);
  y += 50;
  doc.setFontSize(9);
  doc.text('Dinilai oleh HOD', left+20, y);
  doc.text('Disetujui HR/Admin', right-160, y);
  doc.line(left, y-8, left+140, y-8);
  doc.line(right-180, y-8, right-20, y-8);

  doc.save('KPI-'+emp.name.replace(/\s+/g,'_')+'-'+period+'.pdf');
  toast('Laporan KPI diunduh.');
}

function readAttendanceFormIntoDB(empId, ym){
  DB.attendance[ym] = DB.attendance[ym] || {};
  DB.attendance[ym][empId] = DB.attendance[ym][empId] || {};
  var body = document.getElementById('attendanceDayBody');
  if(!body) return;
  var rowsEls = body.querySelectorAll('tr');
  rowsEls.forEach(function(tr){
    var inEl = tr.querySelector('[data-role="att-in"]');
    if(!inEl) return;
    var day = inEl.getAttribute('data-day');
    var outEl = tr.querySelector('[data-role="att-out"]');
    var checkIn = inEl.value || null;
    var checkOut = outEl.value || null;
    if(checkIn){
      DB.attendance[ym][empId][day] = {checkIn:checkIn, checkOut:checkOut};
    } else {
      delete DB.attendance[ym][empId][day];
    }
  });
}

/* ---------------------------- BANNER ---------------------------- */
var BANNER_COLORS = {
  hijau:{label:'Hijau', a:'#1F6B4F', b:'#0F3D2E'},
  emas:{label:'Emas', a:'#C58A1B', b:'#7A5210'},
  biru:{label:'Biru', a:'#2F6FB0', b:'#173E6B'},
  merah:{label:'Merah Marun', a:'#B2455A', b:'#6E1F32'}
};
var BANNER_IMG_CACHE = {};

function activeBanners(){
  return (DB.banners||[]).filter(function(b){ return b.active && !b.deleted; });
}

function bannerSlideHtml(b){
  var c = BANNER_COLORS[b.color] || BANNER_COLORS.hijau;
  var style = 'background:linear-gradient(135deg,'+c.a+','+c.b+');';
  var attr = '';
  if(b.imageUrl){
    var safeUrl = escapeHtml(String(b.imageUrl).replace(/'/g,'%27'));
    style = 'background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.12)),url(\''+safeUrl+'\') center/cover no-repeat;';
  } else if(b.imageKey){
    attr = ' data-banner-key="'+escapeHtml(b.imageKey)+'"';
    if(BANNER_IMG_CACHE[b.imageKey]){
      style = 'background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.12)),url(\''+BANNER_IMG_CACHE[b.imageKey]+'\') center/cover no-repeat;';
    }
  }
  return '<div class="banner-slide"'+attr+' style="'+style+'">'+
    '<div class="banner-text">'+
      (b.title ? '<div class="banner-title">'+escapeHtml(b.title)+'</div>' : '')+
      (b.subtitle ? '<div class="banner-sub">'+escapeHtml(b.subtitle)+'</div>' : '')+
    '</div>'+
  '</div>';
}

function renderBannerCarousel(){
  var list = activeBanners();
  if(!list.length) return '';
  var dots = list.length>1
    ? '<div class="banner-dots">'+list.map(function(b,i){ return '<span class="banner-dot'+(i===0?' active':'')+'"></span>'; }).join('')+'</div>'
    : '';
  return '<div class="banner-wrap"><div class="banner-track" id="bannerTrack">'+list.map(bannerSlideHtml).join('')+'</div>'+dots+'</div>';
}

function hydrateBannerImages(){
  var nodes = document.querySelectorAll('[data-banner-key]');
  Array.prototype.forEach.call(nodes, function(node){
    var key = node.getAttribute('data-banner-key');
    if(BANNER_IMG_CACHE[key]) return;
    resolveAttachmentSrc(key, null).then(function(src){
      if(!src) return;
      BANNER_IMG_CACHE[key] = src;
      node.style.background = 'linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.12)),url(\''+src+'\') center/cover no-repeat';
    }).catch(function(){});
  });
}

function advanceBannerTrack(){
  var t = document.getElementById('bannerTrack');
  if(!t) return;
  var n = t.children.length;
  if(n<2) return;
  var w = t.clientWidth || 1;
  var i = (Math.round(t.scrollLeft / w) + 1) % n;
  if(t.scrollTo){ t.scrollTo({left:i*w, behavior:'smooth'}); } else { t.scrollLeft = i*w; }
}

function updateBannerDots(track){
  var wrap = track.parentElement;
  if(!wrap) return;
  var dots = wrap.querySelectorAll('.banner-dot');
  var i = Math.round(track.scrollLeft / (track.clientWidth || 1));
  Array.prototype.forEach.call(dots, function(d, idx){
    if(idx===i) d.classList.add('active'); else d.classList.remove('active');
  });
}

function getBannerById(id){ return (DB.banners||[]).find(function(b){ return b.id===id; }); }

    '<div class="form-row">'+

      '<div class="form-group"><label>Gambar (opsional, maks. 1.5MB)</label><input type="file" id="bn_file" accept="image/*"></div>'+
    '</div>'+
    (editing && (editing.imageKey||editing.imageUrl) ? '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px;"><input type="checkbox" id="bn_removeimg"> Hapus gambar yang sekarang</label>' : '')+
    '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:14px;"><input type="checkbox" id="bn_active" '+((!editing || editing.active)?'checked':'')+'> Tampilkan di dashboard</label>'+

  '</div>'+
  '<div class="card">'+

    '<div class="table-wrap"><table><thead><tr><th></th><th>Banner</th><th>Status</th><th></th></tr></thead><tbody>'+
    (rows || '<tr><td colspan="4" class="empty-state">Belum ada banner.</td></tr>')+'</tbody></table></div>'+
  '</div>';
}

/* ---------------------------- TO-DO LIST ---------------------------- */
var TODO_STATUS = {
  todo:{label:'Belum', cls:'badge-neutral'},
  doing:{label:'Dikerjakan', cls:'badge-info'},
  done:{label:'Selesai', cls:'badge-success'}
};
var TODO_PRIORITY = {
  rendah:{label:'Rendah', cls:'badge-neutral'},
  normal:{label:'Normal', cls:'badge-info'},
  tinggi:{label:'Tinggi', cls:'badge-danger'}
};

function todoSelfKey(){ return SESSION.role==='hr' ? 'hr' : SESSION.empId; }
function todoOwnerName(ownerId){
  if(ownerId==='hr') return 'HR';
  var e = getEmployee(ownerId);
  return e ? e.name : '(karyawan dihapus)';
}
function getTodoById(id){ return (DB.todos||[]).find(function(t){ return t.id===id; }); }
function todosOf(ownerId){
  return (DB.todos||[]).filter(function(t){ return !t.deleted && t.ownerId===ownerId; });
}
function todoIsOverdue(t){
  return t.status!=='done' && t.due && t.due < todayISO();
}
function todoMonitorScope(){
  /* daftar karyawan yang boleh dipantau & diberi tugas oleh akun ini */
  if(SESSION.role==='hr') return activeEmployees();
  if(SESSION.role==='hod') return getTeamForHod(SESSION.empId).filter(function(e){ return e.id!==SESSION.empId; });
  return [];
}
function todoSortActive(a, b){
  var pr = {tinggi:0, normal:1, rendah:2};
  var ao = todoIsOverdue(a) ? 0 : 1, bo = todoIsOverdue(b) ? 0 : 1;
  if(ao!==bo) return ao-bo;
  var ad = a.due || '9999-12-31', bd = b.due || '9999-12-31';
  if(ad!==bd) return ad < bd ? -1 : 1;
  return (pr[a.priority]||1) - (pr[b.priority]||1);
}

function todoItemHtml(t, mode){
  /* mode: 'mine' (bisa ubah status) | 'monitor' (hanya lihat + hapus) */
  var st = TODO_STATUS[t.status] || TODO_STATUS.todo;
  var pr = TODO_PRIORITY[t.priority] || TODO_PRIORITY.normal;
  var overdue = todoIsOverdue(t);
  var meta = '<span class="badge '+st.cls+'">'+st.label+'</span> '+
    '<span class="badge '+pr.cls+'">'+pr.label+'</span>'+
    (t.due ? ' <span class="badge '+(overdue?'badge-danger':'badge-neutral')+'">'+(overdue?'Lewat tenggat ':'Tenggat ')+formatDateID(t.due)+'</span>' : '')+
    (t.createdById && t.createdById!==t.ownerId ? ' <span class="badge badge-warning">Ditugaskan '+escapeHtml(t.createdByLabel||'')+'</span>' : '');
  var actions = '';
  if(mode==='mine'){
    if(t.status==='todo') actions += '<button class="btn btn-secondary btn-sm" data-action="todo-set-status" data-id="'+t.id+'" data-status="doing">Mulai</button>';
    if(t.status!=='done') actions += '<button class="btn btn-primary btn-sm" data-action="todo-set-status" data-id="'+t.id+'" data-status="done">Selesai</button>';
    else actions += '<button class="btn btn-ghost btn-sm" data-action="todo-set-status" data-id="'+t.id+'" data-status="todo">Buka lagi</button>';
    if(t.createdById===t.ownerId) actions += '<button class="btn btn-ghost btn-sm" data-action="delete-todo" data-id="'+t.id+'" style="color:var(--danger);">Hapus</button>';
  } else {
    actions += '<button class="btn btn-ghost btn-sm" data-action="delete-todo" data-id="'+t.id+'" style="color:var(--danger);">Hapus</button>';
  }
  return '<div class="todo-item'+(t.status==='done'?' done':'')+'">'+
    '<div class="todo-main">'+
      (mode==='monitor' ? '<div class="todo-owner">'+escapeHtml(todoOwnerName(t.ownerId))+'</div>' : '')+
      '<div class="todo-title">'+escapeHtml(t.title)+'</div>'+
      (t.note ? '<div class="todo-note">'+escapeHtml(t.note)+'</div>' : '')+
      ((t.photoKey || t.photoUrl) ? imgThumbHtml(t.photoKey, t.photoUrl, 'todo-photo') : '')+
      '<div class="todo-meta">'+meta+'</div>'+
      (t.doneAt ? '<div class="todo-note">Selesai: '+timeAgoID(t.doneAt)+'</div>' : '')+
    '</div>'+
    '<div class="todo-actions">'+actions+'</div>'+
  '</div>';
}

function todoFormHtml(prefix, withOwner){
  var ownerSel = '';
  if(withOwner){
    var scope = todoMonitorScope();
    ownerSel = '<div class="form-group"><label>Tugaskan ke</label><select id="'+prefix+'_owner">'+
      '<option value="">Pilih karyawan...</option>'+
      scope.map(function(e){ return '<option value="'+e.id+'">'+escapeHtml(e.name)+' &middot; '+escapeHtml(e.department||'')+'</option>'; }).join('')+
    '</select></div>';
  }
  return ownerSel+
    '<div class="form-group"><label>Judul Tugas</label><input id="'+prefix+'_title" maxlength="120" placeholder="Contoh: Siapkan konten Instagram minggu ini"></div>'+
    '<div class="form-group"><label>Catatan (opsional)</label><input id="'+prefix+'_note" maxlength="240"></div>'+
    '<div class="form-row">'+
      '<div class="form-group"><label>Tenggat (opsional)</label><input type="date" id="'+prefix+'_due"></div>'+
      '<div class="form-group"><label>Prioritas</label><select id="'+prefix+'_prio"><option value="normal">Normal</option><option value="tinggi">Tinggi</option><option value="rendah">Rendah</option></select></div>'+
    '</div>'+
    '<div class="form-group"><label>Foto (opsional)</label><input type="file" id="'+prefix+'_photo" accept="image/*"></div>';
}

function renderTodoPage(){
  var canMonitor = SESSION.role==='hr' || SESSION.role==='hod';
  var tab = (canMonitor && STATE.todoTab==='monitor') ? 'monitor' : 'mine';
  var tabs = canMonitor
    ? '<div class="todo-tabs">'+
        '<button class="todo-tab'+(tab==='mine'?' active':'')+'" data-action="todo-tab" data-tab="mine">Tugas Saya</button>'+
        '<button class="todo-tab'+(tab==='monitor'?' active':'')+'" data-action="todo-tab" data-tab="monitor">'+(SESSION.role==='hr'?'Pantau Semua':'Pantau Tim')+'</button>'+
      '</div>'
    : '';
  return tabs + (tab==='monitor' ? renderTodoMonitor() : renderTodoMine());
}

function renderTodoMine(){
  var mine = todosOf(todoSelfKey());
  var active = mine.filter(function(t){ return t.status!=='done'; }).sort(todoSortActive);
  var done = mine.filter(function(t){ return t.status==='done'; }).sort(function(a,b){ return (b.doneAt||'').localeCompare(a.doneAt||''); }).slice(0,15);
  return ''+
  '<div class="card">'+
    '<div class="card-title">Tambah Tugas</div>'+
    '<div class="card-sub">Catat pekerjaan yang harus kamu selesaikan. HR dapat memantau progresnya.</div>'+
    todoFormHtml('td', false)+
    '<button class="btn btn-primary" data-action="add-todo">Tambah ke To-Do</button>'+
  '</div>'+
  '<div class="card">'+
    '<div class="card-title">Tugas Aktif ('+active.length+')</div>'+
    (active.map(function(t){ return todoItemHtml(t,'mine'); }).join('') || '<div class="empty-state">Tidak ada tugas aktif. Mantap!</div>')+
  '</div>'+
  '<div class="card">'+
    '<div class="card-title">Baru Selesai</div>'+
    (done.map(function(t){ return todoItemHtml(t,'mine'); }).join('') || '<div class="empty-state">Belum ada tugas yang selesai.</div>')+
  '</div>';
}

function renderTodoMonitor(){
  var scope = todoMonitorScope();
  var deptFilter = SESSION.role==='hr' ? (STATE.todoFilterDept||'') : '';
  var empFilter = STATE.todoFilterEmp||'';
  var statusFilter = STATE.todoFilterStatus||'';
  var people = scope.filter(function(e){
    return (!deptFilter || e.department===deptFilter) && (!empFilter || e.id===empFilter);
  });
  var summaryRows = people.map(function(e){
    var list = todosOf(e.id);
    var act = list.filter(function(t){ return t.status!=='done'; }).length;
    var dn = list.filter(function(t){ return t.status==='done'; }).length;
    var od = list.filter(todoIsOverdue).length;
    var total = act+dn;
    var pct = total ? Math.round(dn/total*100) : 0;
    return '<tr><td>'+escapeHtml(e.name)+'<div class="muted" style="font-size:11.5px;">'+escapeHtml(e.department||'')+'</div></td>'+
      '<td class="num">'+act+'</td><td class="num">'+dn+'</td>'+
      '<td class="num">'+(od?'<span class="badge badge-danger">'+od+'</span>':'0')+'</td>'+
      '<td style="min-width:110px;"><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:var(--success);"></div></div><div class="muted" style="font-size:11px;">'+pct+'%</div></td></tr>';
  }).join('');
  var ids = {}; people.forEach(function(e){ ids[e.id]=true; });
  var feed = (DB.todos||[]).filter(function(t){
    return !t.deleted && ids[t.ownerId] && (!statusFilter || (statusFilter==='overdue' ? todoIsOverdue(t) : t.status===statusFilter));
  }).sort(function(a,b){ return (b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''); }).slice(0,60);

  var deptSel = SESSION.role==='hr'
    ? '<select id="todoFilterDept"><option value="">Semua departemen</option>'+getDepartments().map(function(d){ return '<option value="'+escapeHtml(d)+'" '+(d===deptFilter?'selected':'')+'>'+escapeHtml(d)+'</option>'; }).join('')+'</select>'
    : '';
  var empSel = '<select id="todoFilterEmp"><option value="">Semua karyawan</option>'+scope.filter(function(e){ return !deptFilter || e.department===deptFilter; }).map(function(e){ return '<option value="'+e.id+'" '+(e.id===empFilter?'selected':'')+'>'+escapeHtml(e.name)+'</option>'; }).join('')+'</select>';
  var statSel = '<select id="todoFilterStatus">'+
    [['','Semua status'],['todo','Belum'],['doing','Dikerjakan'],['done','Selesai'],['overdue','Lewat tenggat']].map(function(o){ return '<option value="'+o[0]+'" '+(o[0]===statusFilter?'selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select>';

  return ''+
  '<div class="card">'+
    '<div class="card-title">Tugaskan ke '+(SESSION.role==='hr'?'Karyawan':'Anggota Tim')+'</div>'+
    '<div class="card-sub">Karyawan yang ditugaskan langsung mendapat notifikasi'+(SESSION.role==='hod'?', dan HR ikut diberi tahu':'')+'.</div>'+
    (scope.length ? todoFormHtml('ta', true)+'<button class="btn btn-primary" data-action="assign-todo">Tugaskan</button>' : '<div class="empty-state">Belum ada karyawan yang bisa ditugaskan.</div>')+
  '</div>'+
  '<div class="card">'+
    '<div class="card-title">Ringkasan Progres</div>'+
    '<div class="toolbar" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">'+deptSel+empSel+statSel+'</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Nama</th><th class="num">Aktif</th><th class="num">Selesai</th><th class="num">Telat</th><th>Progres</th></tr></thead><tbody>'+
    (summaryRows || '<tr><td colspan="5" class="empty-state">Tidak ada karyawan pada filter ini.</td></tr>')+'</tbody></table></div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="card-title">Aktivitas Tugas Terbaru</div>'+
    (feed.map(function(t){ return todoItemHtml(t,'monitor'); }).join('') || '<div class="empty-state">Belum ada tugas pada filter ini.</div>')+
  '</div>';
}

function renderTodoWidget(){
  var title, html;
  if(SESSION.role==='hr'){
    var all = (DB.todos||[]).filter(function(t){ return !t.deleted && t.ownerId!=='hr'; });
    var act = all.filter(function(t){ return t.status!=='done'; });
    var od = act.filter(todoIsOverdue);
    var doneToday = all.filter(function(t){ return t.status==='done' && (t.doneAt||'').slice(0,10)===todayISO(); });
    html = '<div class="todo-widget-stats">'+
      '<div><strong>'+act.length+'</strong><span>Aktif</span></div>'+
      '<div><strong style="color:'+(od.length?'var(--danger)':'inherit')+';">'+od.length+'</strong><span>Lewat tenggat</span></div>'+
      '<div><strong>'+doneToday.length+'</strong><span>Selesai hari ini</span></div>'+
    '</div>'+
    (od.slice(0,3).map(function(t){ return '<div class="todo-mini"><span>'+escapeHtml(todoOwnerName(t.ownerId))+': '+escapeHtml(t.title)+'</span><span class="badge badge-danger">Telat</span></div>'; }).join(''));
    return '<div class="card"><div class="card-title">Pantauan To-Do</div>'+html+
      '<div style="margin-top:12px;"><button class="btn btn-secondary btn-sm" data-action="open-todo-monitor">Buka Pantauan</button></div></div>';
  }
  var mine = todosOf(SESSION.empId).filter(function(t){ return t.status!=='done'; }).sort(todoSortActive);
  var items = mine.slice(0,3).map(function(t){
    return '<div class="todo-mini"><span>'+escapeHtml(t.title)+(todoIsOverdue(t)?' <span class="badge badge-danger">Telat</span>':'')+'</span>'+
      '<button class="btn btn-ghost btn-sm" data-action="todo-set-status" data-id="'+t.id+'" data-status="done">Selesai</button></div>';
  }).join('');
  return '<div class="card"><div class="card-title">To-Do Saya <span class="badge badge-info">'+mine.length+' aktif</span></div>'+
    (items || '<div class="card-sub" style="margin:0 0 4px;">Tidak ada tugas aktif.</div>')+
    '<div style="margin-top:12px;"><button class="btn btn-secondary btn-sm" data-action="nav" data-view="todo">Buka To-Do</button></div></div>';
}

function renderTodayAlertsCard(){
  var t = todayParts();
  var rows = [];
  activeEmployees().forEach(function(e){
    var m = getMatchDay(e.id, t.ym, t.day);
    if(!m.att || !m.att.checkIn) return;
    var flags = [];
    if(m.lateMinutes>0) flags.push('<span class="badge badge-warning">Telat '+m.lateMinutes+' mnt</span>');
    var g = m.att.checkInGeo;
    if(g && !g.withinRange) flags.push('<span class="badge badge-danger">Di luar jangkauan ('+g.distance+' m dari '+escapeHtml(g.name)+')</span>');
    if(!flags.length) return;
    rows.push('<div class="alert-row"><div><strong>'+escapeHtml(e.name)+'</strong> <span class="muted">&middot; masuk '+m.att.checkIn+'</span></div><div class="alert-flags">'+flags.join('')+'</div></div>');
  });
  return '<div class="card"><div class="card-title">Peringatan Absen Hari Ini</div>'+
    '<div class="card-sub">Karyawan yang absen telat atau di luar jangkauan lokasi kantor &mdash; '+formatDateID(t.iso)+'.</div>'+
    (rows.join('') || '<div class="empty-state" style="padding:14px 0;">Tidak ada peringatan hari ini.</div>')+'</div>';
}

/* ---------------------------- AKTIVITAS SAYA ---------------------------- */
function myActivityItems(){
  var items = [];
  var myLabel = currentActorLabel();
  (DB.activityLog||[]).forEach(function(a){
    if(a.actorId ? a.actorId===SESSION.empId : a.actor===myLabel){
      items.push({ts:new Date(a.createdAt).getTime(), kind:'lain', text:a.message});
    }
  });
  var now = new Date();
  var yms = [];
  for(var i=0;i<3;i++){
    var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    yms.push(d.getFullYear()+'-'+pad2(d.getMonth()+1));
  }
  yms.forEach(function(ym){
    var byDay = (DB.attendance[ym] && DB.attendance[ym][SESSION.empId]) || {};
    Object.keys(byDay).forEach(function(day){
      var rec = byDay[day];
      var y = parseInt(ym.slice(0,4),10), mo = parseInt(ym.slice(5,7),10);
      function stamp(time){
        var hh = parseInt(time.slice(0,2),10), mm = parseInt(time.slice(3,5),10);
        return new Date(y, mo-1, parseInt(day,10), hh, mm).getTime();
      }
      function geoText(g){
        if(!g) return '';
        return g.withinRange ? ' · Di lokasi '+g.name : ' · DI LUAR JANGKAUAN (terdekat '+g.name+', '+g.distance+' m)';
      }
      if(rec.checkIn){
        var m = getMatchDay(SESSION.empId, ym, parseInt(day,10));
        items.push({ts:stamp(rec.checkIn), kind:'absen', warn:(m.lateMinutes>0 || (rec.checkInGeo && !rec.checkInGeo.withinRange)),
          text:'Absen masuk pukul '+rec.checkIn+(m.lateMinutes>0?' · Telat '+m.lateMinutes+' menit':' · Tepat waktu')+geoText(rec.checkInGeo)});
      }
      if(rec.checkOut){
        items.push({ts:stamp(rec.checkOut), kind:'absen', warn:!!(rec.checkOutGeo && !rec.checkOutGeo.withinRange),
          text:'Absen pulang pukul '+rec.checkOut+geoText(rec.checkOutGeo)+(rec.checkOutNote?' · Catatan: '+rec.checkOutNote:'')});
      }
    });
  });
  items.sort(function(a,b){ return b.ts - a.ts; });
  return items.slice(0,150);
}

function isNativeApp(){
  try{ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); }catch(e){ return false; }
}
function nativeLocalNotif(){
  try{ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null; }catch(e){ return null; }
}
function deviceNotifSupported(){ return isNativeApp() || ('Notification' in window); }
function deviceNotifGranted(){
  if(isNativeApp()) return !!STATE.nativeNotifGranted;
  return ('Notification' in window) && Notification.permission==='granted';
}
function systemNotify(title, body){
  var ln = nativeLocalNotif();
  if(ln && isNativeApp()){
    try{ ln.schedule({notifications:[{id: Math.floor(Math.random()*2000000000), title:title, body:body, schedule:{at:new Date(Date.now()+300)}}]}); }catch(e){}
    return;
  }
  if('Notification' in window && Notification.permission==='granted' && document.hidden){
    try{ new Notification(title, {body:body}); }catch(e){}
  }
}
function nativePush(){
  try{ return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.PushNotifications) || null; }catch(e){ return null; }
}
function fcmAvailable(){
  return FCM_ENABLED && isNativeApp() && !!nativePush() && BACKEND==='supabase' && !!SUPABASE_URL && !!SUPABASE_ANON_KEY;
}
function fcmRpc(name, args){
  return fetch(SUPABASE_URL+'/rest/v1/rpc/'+name, {
    method:'POST',
    headers: supabaseHeaders({'Content-Type':'application/json'}),
    body: JSON.stringify(args)
  });
}
function fcmSyncRecipient(){
  if(!fcmAvailable() || !STATE.fcmToken || !SESSION.role) return;
  var rcpt = currentPushRecipient();
  if(!rcpt || STATE.fcmRecipient===rcpt || STATE.fcmSyncing===rcpt) return;
  STATE.fcmSyncing = rcpt;
  fcmRpc('register_fcm_token', {p_token: STATE.fcmToken, p_recipient: rcpt}).then(function(r){
    STATE.fcmSyncing = null;
    if(r && r.ok) STATE.fcmRecipient = rcpt; else console.error('register_fcm_token gagal', r && r.status);
  }).catch(function(err){ STATE.fcmSyncing = null; console.error('register_fcm_token error', err); });
}
function fcmUnregister(){
  if(!fcmAvailable() || !STATE.fcmToken) return;
  STATE.fcmRecipient = null;
  fcmRpc('unregister_fcm_token', {p_token: STATE.fcmToken}).catch(function(){});
}
function fcmHandleLink(url){
  if(!SESSION.role) return;
  var link = String(url||'').replace(/^#/, '');
  var items = navItemsFor(SESSION.role).map(function(it){ return it.v; });
  if(link && items.indexOf(link)!==-1){ STATE.view = link; STATE.chatWith = null; render(); }
}
function fcmRegister(){
  var pn = nativePush();
  if(!pn) return Promise.resolve(false);
  return pn.checkPermissions().then(function(r){
    if(r && (r.receive==='prompt' || r.receive==='prompt-with-rationale')) return pn.requestPermissions();
    return r;
  }).then(function(r){
    if(r && r.receive==='granted'){
      STATE.nativeNotifGranted = true;
      return pn.register().then(function(){ return true; });
    }
    return false;
  }).catch(function(err){ console.error('FCM register error', err); return false; });
}
function fcmInit(){
  if(!fcmAvailable()) return Promise.resolve(false);
  if(STATE.fcmInited) return fcmRegister();
  STATE.fcmInited = true;
  var pn = nativePush();
  try{
    pn.addListener('registration', function(t){ STATE.fcmToken = t && t.value; STATE.fcmRecipient = null; fcmSyncRecipient(); });
    pn.addListener('registrationError', function(err){ console.error('FCM registrationError', err); });
    pn.addListener('pushNotificationActionPerformed', function(a){
      var d = a && a.notification && a.notification.data;
      fcmHandleLink(d && d.url);
    });
    pn.addListener('pushNotificationReceived', function(){ try{ refreshLiveData(); chatPoll(); }catch(e){} });
    if(pn.createChannel) pn.createChannel({id:'selaras_default', name:'Notifikasi ABC Selaras', description:'Tugas, absen, pengajuan, dan chat', importance:5, visibility:1, vibration:true});
  }catch(e){ console.error('FCM listener error', e); }
  return fcmRegister();
}
function requestNativeNotifPermission(){
  var ln = nativeLocalNotif();
  if(!ln) return Promise.resolve(false);
  return ln.requestPermissions().then(function(r){
    STATE.nativeNotifGranted = !!(r && r.display==='granted');
    return STATE.nativeNotifGranted;
  }).catch(function(){ return false; });
}

/* ---------------------------- SINKRONISASI LIVE ---------------------------- */
var LIVE_POLL_BUSY = false;
var LIVE_STAMP_SEEN = null, LIVE_STAMP_PENDING = null, LIVE_TICKS = 0;

function mergeById(localArr, remoteArr, stampOf){
  var map = {};
  (localArr||[]).forEach(function(x){ map[x.id] = x; });
  (remoteArr||[]).forEach(function(r){
    var l = map[r.id];
    if(!l){ map[r.id] = r; return; }
    if(stampOf(r) > stampOf(l)) map[r.id] = r;
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}

function mergeLiveData(remote){
  /* notifikasi: gabungkan; status "dibaca" lokal tidak hilang */
  var localById = {};
  (DB.notifications||[]).forEach(function(n){ localById[n.id] = n; });
  var merged = mergeById(DB.notifications, remote.notifications, function(){ return 0; });
  merged.forEach(function(n){ var l = localById[n.id]; if(l && l.read) n.read = true; });
  merged.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
  DB.notifications = merged.slice(0,200);

  DB.todos = mergeById(DB.todos, remote.todos, function(t){ return t.updatedAt || t.createdAt || ''; });
  DB.activityLog = mergeById(DB.activityLog, remote.activityLog, function(){ return 0; })
    .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).slice(0,600);
  if(SESSION.role!=='hr' && remote.banners) DB.banners = remote.banners;

  /* absensi: ambil catatan check-in/out baru milik orang lain supaya tidak tertimpa saat menyimpan */
  var ra = remote.attendance || {};
  Object.keys(ra).forEach(function(ym){
    Object.keys(ra[ym]||{}).forEach(function(emp){
      Object.keys(ra[ym][emp]||{}).forEach(function(day){
        var r = ra[ym][emp][day];
        DB.attendance[ym] = DB.attendance[ym] || {};
        DB.attendance[ym][emp] = DB.attendance[ym][emp] || {};
        var l = DB.attendance[ym][emp][day];
        if(!l || (r.checkIn && !l.checkIn) || (r.checkOut && !l.checkOut)){
          DB.attendance[ym][emp][day] = r;
        }
      });
    });
  });
}

function liveSafeToRerender(){
  if(document.getElementById('modalRoot') && document.getElementById('modalRoot').innerHTML.trim()) return false;
  if(STATE.view==='checkin') return false;
  var fields = document.querySelectorAll('#app .content input, #app .content textarea');
  for(var i=0;i<fields.length;i++){
    var f = fields[i];
    if(f.type==='file'){ if(f.files && f.files.length) return false; continue; }
    if(f.type==='checkbox' || f.type==='radio' || f.type==='hidden') continue;
    if(f.value) return false;
  }
  return true;
}

function refreshLiveData(){
  if(LIVE_POLL_BUSY || !STATE.loaded || STATE.loadError || !SESSION.role) return Promise.resolve(false);
  LIVE_POLL_BUSY = true;
  var getter = hasRemoteStorage() ? remoteGet('hrdb') : fallbackGet('hrdb');
  return getter.then(function(res){
    LIVE_POLL_BUSY = false;
    if(!res || !res.value || !SESSION.role) return false;
    var remote;
    try{ remote = JSON.parse(res.value); }catch(e){ return false; }
    LIVE_STAMP_SEEN = LIVE_STAMP_PENDING;
    var before = {};
    myNotifications().forEach(function(n){ before[n.id] = true; });
    mergeLiveData(remote);
    var fresh = myNotifications().filter(function(n){ return !before[n.id] && !n.read; });
    fresh.slice(0,3).forEach(function(n){ systemNotify('ABC Selaras', n.message); });
    if(fresh.length){ toast(fresh[0].message); }
    var liveViews = ['dashboard','todo','my-activity','attendance','hod-attendance','banners'];
    if(liveViews.indexOf(STATE.view)!==-1 && liveSafeToRerender()) render();
    else updateBellBadge();
    return true;
  }).catch(function(err){
    LIVE_POLL_BUSY = false;
    console.error('refreshLiveData error', err);
    return false;
  });
}

/* Cek ringan (hanya updated_at) tiap ~5 detik; tarik data penuh hanya bila berubah.
   Setiap 6 putaran (~30 dtk) tetap tarik penuh sebagai jaring pengaman. */
function liveTick(force){
  if(!STATE.loaded || STATE.loadError || !SESSION.role || LIVE_POLL_BUSY) return Promise.resolve(false);
  if(document.hidden && !force) return Promise.resolve(false);
  LIVE_TICKS++;
  var full = force || LIVE_TICKS % 6 === 0 || !(hasRemoteStorage() && BACKEND==='supabase');
  if(full){ LIVE_STAMP_PENDING = null; return refreshLiveData(); }
  return supabaseStamp('hrdb').then(function(st){
    if(st && st === LIVE_STAMP_SEEN) return false;
    LIVE_STAMP_PENDING = st;
    return refreshLiveData();
  }).catch(function(){ return false; });
}

function startLiveSync(){
  if(window.__liveSyncStarted) return;
  window.__liveSyncStarted = true;
  setInterval(function(){ liveTick(false); }, 5000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ liveTick(true); chatPoll(); } });
  window.addEventListener('focus', function(){ liveTick(true); });
  window.addEventListener('online', function(){ liveTick(true); });
  setInterval(advanceBannerTrack, 5500);
  setInterval(chatPoll, 6000);
  document.addEventListener('scroll', function(e){
    if(e.target && e.target.id==='bannerTrack') updateBannerDots(e.target);
  }, true);
}

function createTodo(f){
  DB.todos = DB.todos || [];
  var now = new Date().toISOString();
  var selfKey = todoSelfKey();
  var selfEmp = SESSION.role==='hr' ? null : getEmployee(SESSION.empId);
  var selfName = SESSION.role==='hr' ? 'HR' : (selfEmp ? selfEmp.name : '');
  var t = {
    id: uid('TD'), ownerId: f.ownerId, title: f.title, note: f.note||'', due: f.due||'',
    priority: f.priority||'normal', status:'todo',
    createdById: selfKey, createdByLabel: 'oleh '+selfName,
    createdAt: now, updatedAt: now, doneAt: null,
    photoKey: f.photoKey || null, photoUrl: f.photoUrl || null
  };
  DB.todos.unshift(t);
  var ownerName = todoOwnerName(f.ownerId);
  var dueTxt = t.due ? ' (tenggat '+formatDateID(t.due)+')' : '';
  if(f.ownerId!==selfKey){
    addNotification({type:'emp', empId:f.ownerId}, (SESSION.role==='hr' ? 'HR' : 'HOD '+selfName)+' memberi tugas baru: '+t.title+dueTxt+'.', 'todo', 'todo');
    if(SESSION.role==='hod') addNotification({type:'hr'}, 'HOD '+selfName+' menugaskan '+ownerName+': '+t.title+dueTxt+'.', 'todo', 'todo');
  } else if(SESSION.role!=='hr'){
    addNotification({type:'hr'}, ownerName+' menambahkan tugas: '+t.title+dueTxt+'.', 'todo', 'todo');
  }
  if(f.ownerId!==selfKey && (SESSION.role==='hod' || SESSION.role==='hr')){
    /* tugas dari HOD/HR juga masuk ke chat penerima */
    var tl = [t.title];
    if(t.note) tl.push(t.note);
    if(t.due) tl.push('Tenggat: '+formatDateID(t.due));
    tl.push('Prioritas: '+(TODO_PRIORITY[t.priority] || TODO_PRIORITY.normal).label);
    chatPostSystem(f.ownerId, tl.join('\n'), {kind:'task', image_key:t.photoKey||null, image_url:t.photoUrl||null});
  }
  logActivity('Membuat tugas "'+t.title+'"'+(f.ownerId!==selfKey ? ' untuk '+ownerName : '')+'.');
  return t;
}

function setTodoStatus(t, newStatus){
  var now = new Date().toISOString();
  var was = t.status;
  t.status = newStatus;
  t.updatedAt = now;
  t.doneAt = newStatus==='done' ? now : null;
  if(newStatus==='done' && was!=='done'){
    var who = todoOwnerName(t.ownerId);
    if(SESSION.role!=='hr') addNotification({type:'hr'}, who+' menyelesaikan tugas: '+t.title+'.', 'todo', 'todo');
    if(t.createdById && t.createdById!=='hr' && t.createdById!==t.ownerId){
      addNotification({type:'emp', empId:t.createdById}, who+' menyelesaikan tugas yang kamu berikan: '+t.title+'.', 'todo', 'todo');
    }
    logActivity('Menyelesaikan tugas "'+t.title+'".');
  } else if(newStatus==='doing'){
    logActivity('Mulai mengerjakan tugas "'+t.title+'".');
  }
}

/* isi dalam lingkaran avatar: foto kalau ada, kalau tidak inisial */
function avatarInner(emp){
  if(emp && emp.photoUrl) return avatarImgTag(emp.photoUrl);
  if(emp && emp.photoKey && AVATAR_CACHE[emp.photoKey]) return avatarImgTag(AVATAR_CACHE[emp.photoKey]);
  return escapeHtml(nameInitial(emp ? emp.name : 'HR'));
}
function avatarKeyAttr(emp){
  return (emp && !emp.photoUrl && emp.photoKey && !AVATAR_CACHE[emp.photoKey]) ? ' data-avatar-key="'+escapeHtml(emp.photoKey)+'"' : '';
}
/* emp = objek karyawan; null/undefined = HR */
function avatarHtml(emp, size){
  var s = size || 36;
  var inner = emp ? avatarInner(emp) : 'HR';
  return '<span class="avatar'+(emp?'':' avatar-hr')+'" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s*0.38)+'px;"'+avatarKeyAttr(emp)+'>'+inner+'</span>';
}
function avatarDashHtml(emp){
  return '<button type="button" class="dash-profile-avatar" data-action="nav" data-view="my-profile" aria-label="Foto profil"'+avatarKeyAttr(emp)+'>'+avatarInner(emp)+'</button>';
}

function hydrateAvatars(){
  var nodes = document.querySelectorAll('[data-avatar-key]');
  Array.prototype.forEach.call(nodes, function(node){
    var key = node.getAttribute('data-avatar-key');
    if(AVATAR_CACHE[key]){ node.innerHTML = avatarImgTag(AVATAR_CACHE[key]); node.removeAttribute('data-avatar-key'); return; }
    resolveAttachmentSrc(key, null).then(function(src){
      if(!src) return;
      AVATAR_CACHE[key] = src;
      node.innerHTML = avatarImgTag(src);
      node.removeAttribute('data-avatar-key');
    }).catch(function(){});
  });
}

/* potong tengah jadi persegi lalu kecilkan -> foto profil ringan */
function compressSquare(file, size, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var side = Math.min(img.width, img.height);
        var sx = Math.round((img.width-side)/2), sy = Math.round((img.height-side)/2);
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        canvas.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', quality||0.82));
      };
      img.onerror = function(){ reject(new Error('Gagal memuat gambar.')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Gagal membaca file.')); };
    reader.readAsDataURL(file);
  });
}

function canEditPhotoOf(empId){
  return SESSION.role==='hr' || (SESSION.empId && SESSION.empId===empId);
}

function setEmployeePhotoFromFile(empId, file){
  var emp = getEmployee(empId);
  if(!emp || !canEditPhotoOf(empId)) return Promise.resolve(false);
  if(!file || !file.type || file.type.indexOf('image/')!==0){ toast('Pilih file gambar (JPG/PNG).'); return Promise.resolve(false); }
  if(file.size > 8*1024*1024){ toast('Ukuran foto terlalu besar (maks. 8MB).'); return Promise.resolve(false); }
  toast('Mengunggah foto profil...');
  return compressSquare(file, 320, 0.82).then(function(dataUrl){
    return uploadAttachment('avatar_'+empId+'_'+Date.now()+'.jpg', dataUrl, 'image/jpeg');
  }).then(function(res){
    emp.photoKey = res.key; emp.photoUrl = res.url || null;
    logActivity('Mengubah foto profil '+(SESSION.role==='hr' ? emp.name : 'sendiri')+'.');
    return saveDB();
  }).then(function(){ toast('Foto profil diperbarui.'); render(); return true; })
  .catch(function(err){ console.error('setEmployeePhoto error', err); toast('Gagal mengunggah foto profil.'); return false; });
}

/* ---------------------------- CHAT ---------------------------- */
var CHAT_TABLE_MISSING = 'Fitur chat belum aktif di server. Minta admin menjalankan file supabase/chat.sql di Supabase (SQL Editor).';
var CHAT_SCHEMA_OLD = 'Chat perlu diperbarui di server (foto & hapus pesan). Minta admin menjalankan ulang file supabase/chat.sql di Supabase (SQL Editor).';
var CHAT_IMG_BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
var CHAT_ICON_TASK = '📋';
var CHAT_ICON_PHOTO = '📷';

function chatNewState(){
  return {me:null, msgs:[], lastId:0, loaded:false, error:'', busy:false, readMap:{}, cleared:{}, draft:'', search:'', lastSend:0, pending:null, sending:false};
}
var CHAT = chatNewState();

function chatMe(){ return SESSION.role==='hr' ? 'hr' : SESSION.empId; }
function chatRemote(){ return BACKEND==='supabase' && hasRemoteStorage(); }
function chatAudience(id){ return id==='hr' ? {type:'hr'} : {type:'emp', empId:id}; }
function chatPeerName(id){ if(id==='hr') return 'HR'; var e = getEmployee(id); return e ? e.name : '(karyawan dihapus)'; }
function chatPeerEmp(id){ return id==='hr' ? null : getEmployee(id); }
function chatBlocked(){ return CHAT.error===CHAT_TABLE_MISSING || CHAT.error===CHAT_SCHEMA_OLD; }

function chatReadKey(me){ return 'abcChatRead_'+me; }
function chatClearKey(me){ return 'abcChatClear_'+me; }
function chatLoadLocalMaps(me){
  try{ CHAT.readMap = JSON.parse(window.localStorage.getItem(chatReadKey(me)) || '{}') || {}; }catch(e){ CHAT.readMap = {}; }
  try{ CHAT.cleared = JSON.parse(window.localStorage.getItem(chatClearKey(me)) || '{}') || {}; }catch(e){ CHAT.cleared = {}; }
}
function chatSaveReadMap(me){
  try{ window.localStorage.setItem(chatReadKey(me), JSON.stringify(CHAT.readMap)); }catch(e){}
}
function chatSaveCleared(me){
  try{ window.localStorage.setItem(chatClearKey(me), JSON.stringify(CHAT.cleared)); }catch(e){}
}

function chatReset(){
  CHAT = chatNewState();
  STATE.chatWith = null; STATE.chatNew = false; STATE.chatEdit = false;
}

function chatEnsureIdentity(){
  var me = chatMe();
  if(!me){ return false; }
  if(CHAT.me !== me){
    var first = !CHAT.me;
    var keepWith = STATE.chatWith, keepNew = STATE.chatNew, keepEdit = STATE.chatEdit;
    chatReset();
    if(first){ STATE.chatWith = keepWith; STATE.chatNew = keepNew; STATE.chatEdit = keepEdit; }  /* inisialisasi pertama: jangan hapus pilihan yang sudah dibuat */
    CHAT.me = me;
    chatLoadLocalMaps(me);
  }
  return true;
}

/* ---- penyimpanan: tabel Supabase (chat_messages) atau localStorage (mode lokal) ----
   Jenis baris (kind): 'msg' pesan biasa, 'task' pesan tugas dari HOD/HR,
   'del' penanda hapus (ref_id = id pesan yang dihapus oleh pengirimnya). */
function chatLocalAll(){
  try{ return JSON.parse(window.localStorage.getItem('abcChatLocal') || '[]') || []; }catch(e){ return []; }
}
function chatHttpError(res){
  var err;
  if(res.status===404){ err = new Error('chat_table_missing'); err.code = 'missing'; }
  else if(res.status===400){ err = new Error('chat_schema_old'); err.code = 'schema'; }
  else { err = new Error('HTTP '+res.status); }
  return err;
}
function chatFetchRemote(me, afterId){
  var url = SUPABASE_URL+'/rest/v1/chat_messages?select=id,sender,recipient,body,created_at,kind,ref_id,image_key,image_url'+
    '&or='+encodeURIComponent('(sender.eq.'+me+',recipient.eq.'+me+')')+
    '&id=gt.'+afterId+'&order=id.asc&limit=500';
  return fetch(url, {method:'GET', headers: supabaseHeaders()}).then(function(res){
    if(!res.ok) throw chatHttpError(res);
    return res.json();
  });
}
function chatSendRemote(me, to, body, extra){
  var row = {sender:me, recipient:to, body:body};
  if(extra){ ['kind','ref_id','image_key','image_url'].forEach(function(k){ if(extra[k]!==undefined && extra[k]!==null) row[k] = extra[k]; }); }
  return fetch(SUPABASE_URL+'/rest/v1/chat_messages', {
    method:'POST',
    headers: supabaseHeaders({'Content-Type':'application/json','Prefer':'return=representation'}),
    body: JSON.stringify([row])
  }).then(function(res){
    if(!res.ok) throw chatHttpError(res);
    return res.json();
  }).then(function(rows){ return rows && rows[0]; });
}
function chatFetch(me, afterId){
  if(chatRemote()) return chatFetchRemote(me, afterId);
  return Promise.resolve(chatLocalAll().filter(function(m){ return m.id>afterId && (m.sender===me || m.recipient===me); }));
}
function chatSendStore(me, to, body, extra){
  if(chatRemote()) return chatSendRemote(me, to, body, extra);
  var all = chatLocalAll();
  var nextId = all.reduce(function(mx, m){ return Math.max(mx, m.id); }, 0) + 1;
  var row = {id:nextId, sender:me, recipient:to, body:body, created_at:new Date().toISOString(),
    kind:(extra && extra.kind) || 'msg', ref_id:(extra && extra.ref_id) || null,
    image_key:(extra && extra.image_key) || null, image_url:(extra && extra.image_url) || null};
  all.push(row);
  try{ window.localStorage.setItem('abcChatLocal', JSON.stringify(all.slice(-2000))); }catch(e){ return Promise.reject(e); }
  return Promise.resolve(row);
}

function chatMergeRows(rows){
  var seen = {};
  CHAT.msgs.forEach(function(m){ seen[m.id] = true; });
  var added = [];
  (rows||[]).forEach(function(r){
    if(!r || seen[r.id]) return;
    seen[r.id] = true;
    r.kind = r.kind || 'msg';
    CHAT.msgs.push(r);
    added.push(r);
    if(r.id > CHAT.lastId) CHAT.lastId = r.id;
  });
  CHAT.msgs.sort(function(a,b){ return a.id - b.id; });
  return added;
}

function chatConvOf(m, me){ return m.sender===me ? m.recipient : m.sender; }

/* pesan yang tampil: tanpa penanda hapus, tanpa pesan yang sudah dihapus pengirimnya,
   dan tanpa pesan sebelum "hapus percakapan" (disimpan di perangkat ini) */
function chatVisible(){
  var me = CHAT.me, dead = {}, byId = {};
  CHAT.msgs.forEach(function(m){ byId[m.id] = m; });
  CHAT.msgs.forEach(function(m){
    if(m.kind==='del' && m.ref_id){ var t = byId[m.ref_id]; if(t && t.sender===m.sender) dead[t.id] = true; }
  });
  return CHAT.msgs.filter(function(m){
    if(m.kind==='del' || dead[m.id]) return false;
    return m.id > (CHAT.cleared[chatConvOf(m, me)] || 0);
  });
}

function chatUnreadFor(peerId){
  var me = CHAT.me;
  var lastRead = CHAT.readMap[peerId] || 0;
  return chatVisible().filter(function(m){ return m.sender===peerId && m.recipient===me && m.id>lastRead; }).length;
}
function chatUnreadTotal(){
  if(!CHAT.me) return 0;
  var lr = CHAT.readMap, me = CHAT.me;
  return chatVisible().filter(function(m){ return m.recipient===me && m.sender!==me && m.id>(lr[m.sender]||0); }).length;
}
function chatMarkRead(peerId){
  var maxId = 0;
  CHAT.msgs.forEach(function(m){ if(m.sender===peerId && m.recipient===CHAT.me && m.id>maxId) maxId = m.id; });
  if(maxId > (CHAT.readMap[peerId]||0)){
    CHAT.readMap[peerId] = maxId;
    chatSaveReadMap(CHAT.me);
  }
}

/* semua kontak yang bisa dichat (untuk "Chat baru") */
function chatPeers(){
  var me = chatMe();
  var peers = [];
  if(me!=='hr') peers.push({id:'hr', name:'HR', emp:null, sub:'Tim HR'});
  activeEmployees().forEach(function(e){
    if(e.id!==me) peers.push({id:e.id, name:e.name, emp:e, sub:(e.position||'')+(e.department ? ' · '+e.department : '')});
  });
  /* percakapan dengan karyawan yang sudah nonaktif tetap muncul */
  CHAT.msgs.forEach(function(m){
    var pid = chatConvOf(m, me);
    if(pid!=='hr' && !peers.some(function(p){ return p.id===pid; })){
      var e = getEmployee(pid);
      if(e) peers.push({id:pid, name:e.name, emp:e, sub:'Nonaktif'});
    }
  });
  return peers;
}

function chatLastMsgWith(peerId){
  var vis = chatVisible();
  for(var i=vis.length-1;i>=0;i--){
    var m = vis[i];
    if(m.sender===peerId || m.recipient===peerId) return m;
  }
  return null;
}

function chatPreview(m){
  var firstLine = String(m.body||'').split('\n')[0];
  if(m.kind==='task') return CHAT_ICON_TASK+' '+firstLine;
  var hasImg = !!(m.image_key || m.image_url);
  if(hasImg) return CHAT_ICON_PHOTO+' '+(firstLine || 'Foto');
  return firstLine;
}

function chatTimeLabel(iso){
  var d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  var now = new Date();
  var same = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  return same ? pad2(d.getHours())+':'+pad2(d.getMinutes()) : d.getDate()+' '+MONTHS_ID[d.getMonth()].slice(0,3);
}

/* gambar (foto chat / foto tugas): langsung dari URL, atau diambil dari penyimpanan lalu diisi belakangan */
function imgThumbHtml(key, url, cls){
  var src = url || (key && AVATAR_CACHE[key]) || '';
  var pend = (!src && key) ? ' data-img-key="'+escapeHtml(key)+'"' : '';
  return '<img class="'+cls+'" data-action="view-image" alt="Foto"'+pend+' src="'+(src ? escapeHtml(String(src).replace(/"/g,'%22')) : CHAT_IMG_BLANK)+'">';
}
function hydrateImages(){
  var nodes = document.querySelectorAll('img[data-img-key]');
  Array.prototype.forEach.call(nodes, function(node){
    var key = node.getAttribute('data-img-key');
    if(AVATAR_CACHE[key]){ node.src = AVATAR_CACHE[key]; node.removeAttribute('data-img-key'); return; }
    resolveAttachmentSrc(key, null).then(function(src){
      if(!src) return;
      AVATAR_CACHE[key] = src;
      node.src = src;
      node.removeAttribute('data-img-key');
    }).catch(function(){});
  });
}
function openImageViewer(src){
  if(!src || src.indexOf('data:image/gif')===0) return;
  openModal('<div class="modal-overlay img-viewer" data-action="overlay-close"><img id="imgViewerImg" alt="Foto"><button type="button" class="btn btn-secondary img-viewer-close" data-action="close-modal">Tutup</button></div>');
  var im = document.getElementById('imgViewerImg');
  if(im) im.src = src;
}

function chatListItemHtml(p, last, unread, withPreview){
  var preview = withPreview && last ? ((last.sender===CHAT.me ? 'Kamu: ' : '')+chatPreview(last)) : p.sub;
  return '<button type="button" class="chat-item'+(STATE.chatWith===p.id?' active':'')+'" data-action="chat-open" data-peer="'+escapeHtml(p.id)+'">'+
    avatarHtml(p.emp, 44)+
    '<span class="chat-item-body">'+
      '<span class="chat-item-top"><span class="chat-item-name">'+escapeHtml(p.name)+'</span>'+(withPreview && last?'<span class="chat-item-time">'+chatTimeLabel(last.created_at)+'</span>':'')+'</span>'+
      '<span class="chat-item-prev'+(unread?' unread':'')+'">'+escapeHtml(preview.length>60 ? preview.slice(0,60)+'…' : preview)+'</span>'+
    '</span>'+
    (unread ? '<span class="chat-unread">'+(unread>99?'99+':unread)+'</span>' : '')+
  '</button>';
}

function chatListHtml(){
  var q = (CHAT.search||'').trim().toLowerCase();
  var peers = chatPeers().filter(function(p){ return !q || p.name.toLowerCase().indexOf(q)!==-1; });
  if(STATE.chatNew){
    peers.sort(function(a,b){ return a.name.localeCompare(b.name); });
    return peers.map(function(p){ return chatListItemHtml(p, null, 0, false); }).join('') || '<div class="empty-state">Tidak ada kontak yang cocok.</div>';
  }
  var rows = peers.map(function(p){ return {p:p, last:chatLastMsgWith(p.id)}; }).filter(function(r){ return !!r.last; });
  rows.sort(function(a,b){ return b.last.id - a.last.id; });
  if(!rows.length){
    return q ? '<div class="empty-state">Tidak ditemukan.</div>'
      : '<div class="empty-state">Belum ada percakapan.<br>Ketuk <strong>+ Baru</strong> untuk memulai chat.</div>';
  }
  return rows.map(function(r){ return chatListItemHtml(r.p, r.last, chatUnreadFor(r.p.id), true); }).join('');
}

function chatMessagesHtml(){
  var peer = STATE.chatWith;
  var me = CHAT.me;
  var list = chatVisible().filter(function(m){ return (m.sender===me && m.recipient===peer) || (m.sender===peer && m.recipient===me); });
  if(!list.length) return '<div class="empty-state">Belum ada pesan. Sapa '+escapeHtml(chatPeerName(peer))+' di bawah ini.</div>';
  var lastDay = '';
  return list.map(function(m){
    var d = new Date(m.created_at);
    var dayIso = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    var head = '';
    if(dayIso!==lastDay){ lastDay = dayIso; head = '<div class="chat-day">'+(dayIso===todayISO()?'Hari ini':formatDateID(dayIso))+'</div>'; }
    var mine = m.sender===me;
    var hasImg = !!(m.image_key || m.image_url);
    var inner = (m.kind==='task' ? '<div class="chat-task-tag">'+CHAT_ICON_TASK+' Tugas baru</div>' : '')+
      (hasImg ? imgThumbHtml(m.image_key, m.image_url, 'chat-img') : '')+
      (m.body ? '<div class="chat-text">'+escapeHtml(m.body)+'</div>' : '');
    var del = (STATE.chatEdit && mine) ? '<button type="button" class="chat-del" data-action="chat-del" data-id="'+m.id+'">Hapus</button>' : '';
    return head+'<div class="chat-msg '+(mine?'mine':'theirs')+'"><div class="chat-bubble'+(m.kind==='task'?' is-task':'')+(hasImg?' has-img':'')+'">'+inner+'</div>'+
      '<div class="chat-msg-time">'+pad2(d.getHours())+':'+pad2(d.getMinutes())+del+'</div></div>';
  }).join('');
}

function chatScrollToEnd(){
  var box = document.getElementById('chatMessages');
  if(box) box.scrollTop = box.scrollHeight;

function chatPoll(){
  if(!STATE.loaded || STATE.loadError || !SESSION.role) return Promise.resolve(false);
  if(!chatEnsureIdentity()) return Promise.resolve(false);
  if(CHAT.busy || chatBlocked()) return Promise.resolve(false);
  CHAT.busy = true;
  var me = CHAT.me;
  var wasLoaded = CHAT.loaded;
  return chatFetch(me, CHAT.lastId).then(function(rows){
    CHAT.busy = false;
    if(CHAT.me!==me) return false;
    CHAT.error = '';
    var added = chatMergeRows(rows);
    CHAT.loaded = true;
    /* notifikasi hanya untuk pesan biasa (pesan tugas sudah punya notifikasi To-Do sendiri) */
    var incoming = added.filter(function(m){ return m.recipient===me && m.sender!==me && m.kind==='msg'; });
    var viewing = STATE.view==='chat' ? STATE.chatWith : null;
    if(viewing && !document.hidden) chatMarkRead(viewing);
    if(wasLoaded && incoming.length){
      var aud = chatAudience(me);
      var fresh = incoming.filter(function(m){ return !(m.sender===viewing && !document.hidden); });
      if(fresh.length && notifAllowed(aud, 'chat')){
        var m0 = fresh[fresh.length-1];
        var nm = chatPeerName(m0.sender);
        var txt = m0.body || (CHAT_ICON_PHOTO+' Foto');
        systemNotify(nm, txt);
        if(STATE.view!=='chat') toast('Pesan baru dari '+nm+': '+(txt.length>50 ? txt.slice(0,50)+'…' : txt));
      }
    }
    if(added.length || !wasLoaded) updateChatDom();
    return true;
  }).catch(function(err){
    CHAT.busy = false;
    if(err && (err.code==='missing' || err.code==='schema')){
      CHAT.error = err.code==='missing' ? CHAT_TABLE_MISSING : CHAT_SCHEMA_OLD;
      if(STATE.view==='chat') render();
    }
    return false;
  });
}

function chatSend(){
  if(!chatEnsureIdentity()) return Promise.resolve(false);
  var peer = STATE.chatWith;
  var input = document.getElementById('chatInput');
  var body = (input ? input.value : CHAT.draft || '').trim();
  var pending = CHAT.pending;
  if(!peer || (!body && !pending)) return Promise.resolve(false);
  if(body.length > 1000){ toast('Pesan terlalu panjang (maks. 1000 karakter).'); return Promise.resolve(false); }
  if(CHAT.sending || Date.now() - CHAT.lastSend < 400) return Promise.resolve(false);
  CHAT.lastSend = Date.now();
  CHAT.sending = true;
  var me = CHAT.me;
  var upload = pending
    ? uploadAttachment('chat_'+me+'_'+Date.now()+'.jpg', pending.dataUrl, 'image/jpeg')
    : Promise.resolve(null);
  return upload.then(function(att){
    return chatSendStore(me, peer, body, att ? {image_key:att.key, image_url:att.url||null} : null);
  }).then(function(row){
    CHAT.sending = false;
    if(CHAT.me!==me) return false;
    chatMergeRows([row]);
    CHAT.draft = '';
    CHAT.pending = null;
    if(input) input.value = '';
    chatMarkRead(peer);
    if(pending) render(); else updateChatDom();
    chatScrollToEnd();
    var aud = chatAudience(peer);
    if(notifAllowed(aud, 'chat')){
      var pv = body || (CHAT_ICON_PHOTO+' Foto');
      triggerPush(aud, 'Pesan dari '+chatPeerName(me)+': '+(pv.length>80 ? pv.slice(0,80)+'…' : pv), 'chat');
    }
    return true;
  }).catch(function(err){
    CHAT.sending = false;
    if(err && (err.code==='missing' || err.code==='schema')){ CHAT.error = err.code==='missing' ? CHAT_TABLE_MISSING : CHAT_SCHEMA_OLD; render(); }
    else toast('Pesan gagal terkirim. Periksa koneksi lalu coba lagi.');
    return false;
  });
}

/* hapus pesan sendiri untuk semua pihak (dikirim sebagai penanda hapus) */
function chatDeleteMessage(id){
  if(!chatEnsureIdentity()) return Promise.resolve(false);
  var me = CHAT.me;
  var m = CHAT.msgs.filter(function(x){ return x.id===id; })[0];
  if(!m || m.sender!==me || m.kind==='del') return Promise.resolve(false);
  return chatSendStore(me, m.recipient, '', {kind:'del', ref_id:id}).then(function(row){
    if(CHAT.me!==me) return false;
    chatMergeRows([row]);
    updateChatDom();
    return true;
  }).catch(function(){ toast('Gagal menghapus pesan.'); return false; });
}

/* hapus percakapan hanya di perangkat ini (lawan bicara tetap menyimpan) */
function chatClearConversation(peer){
  var me = CHAT.me, maxId = 0;
  CHAT.msgs.forEach(function(m){ if(chatConvOf(m, me)===peer && m.id>maxId) maxId = m.id; });
  CHAT.cleared[peer] = maxId;
  chatSaveCleared(me);
}

function chatAttachFromFile(file){
  if(!file) return Promise.resolve(false);
  if(!file.type || file.type.indexOf('image/')!==0){ toast('Pilih file gambar (JPG/PNG).'); return Promise.resolve(false); }
  if(file.size > 8*1024*1024){ toast('Ukuran foto terlalu besar (maks. 8MB).'); return Promise.resolve(false); }
  return compressImageFile(file, 1280, 0.7).then(function(dataUrl){
    chatEnsureIdentity();
    CHAT.pending = {dataUrl:dataUrl};
    render();
    return true;
  }).catch(function(){ toast('Gagal memproses foto.'); return false; });
}

/* pesan otomatis (mis. tugas dari HOD/HR) tanpa menyentuh kolom ketik */
function chatPostSystem(to, body, extra){
  var me = chatMe();
  if(!me || !to) return Promise.resolve(false);
  return chatSendStore(me, to, body, extra).then(function(row){
    if(CHAT.me===me){ chatMergeRows([row]); if(STATE.view==='chat') updateChatDom(); }
    return true;
  }).catch(function(){ return false; });
}

    return;
  }
  if(t.id === 'kpiFilterDept'){
    STATE.kpiFilterDept = t.value;
    render();
    return;
  }
  if(t.getAttribute('data-role')==='kpi-realisasi'){
    var kpiDraft = getKpiFillDraft(STATE.selectedKpiEmp, STATE.currentMonth);
    kpiDraft.values[t.getAttribute('data-kpi-id')] = t.value;
    render();
    return;
  }
  if(t.id === 'attendanceEmpSelect'){
    readAttendanceFormIntoDB(STATE.selectedAttendanceEmp, STATE.currentMonth);
    STATE.selectedAttendanceEmp = t.value;
    render();
    return;
  }
  if(t.id === 'hodEmpSelect'){
    STATE.selectedHodEmp = t.value;
    render();
    return;
  }
  if(t.id === 'attSpreadsheetFile'){
    var f = t.files[0];
    if(f) importAttendanceSpreadsheet(f);
    return;
  }
  if(t.getAttribute('data-role')==='ann-toall'){
    getAnnouncementDraft().toAll = t.checked;
    render();
    return;
  }
  if(t.getAttribute('data-role')==='ann-emp'){
    var annEmpId = t.getAttribute('data-id');
    getAnnouncementDraft().empIds[annEmpId] = t.checked;
    return;
  }
  if(t.id === 'ann_deptFilter'){
    getAnnouncementDraft().deptFilter = t.value;
    return;
  }
  if(t.getAttribute('data-role')==='pattern-type'){
    var wd = t.getAttribute('data-wd');
    STATE.patternDraft[wd] = STATE.patternDraft[wd] || {};
    STATE.patternDraft[wd].type = t.value;
    if(t.value==='kerja' && !STATE.patternDraft[wd].start){
      STATE.patternDraft[wd].start = '08:30'; STATE.patternDraft[wd].end = '17:00';
    }
    render();
    return;
  }
  if(t.getAttribute('data-role')==='pattern-start'){
    STATE.patternDraft[t.getAttribute('data-wd')].start = t.value;
    STATE.patternDraft[t.getAttribute('data-wd')].shiftId = '';
    return;
  }
  if(t.getAttribute('data-role')==='pattern-end'){
    STATE.patternDraft[t.getAttribute('data-wd')].end = t.value;
    STATE.patternDraft[t.getAttribute('data-wd')].shiftId = '';
    return;
  }
  if(t.getAttribute('data-role')==='pattern-shift'){
    var pwd = t.getAttribute('data-wd');
    var preset = findShiftPreset(t.value);
    STATE.patternDraft[pwd].shiftId = t.value;
    if(preset){
      STATE.patternDraft[pwd].start = preset.start;
      STATE.patternDraft[pwd].end = preset.end;
    }
    render();
    return;
  }
  if(t.id === 'dse_type'){
    var timerow = document.getElementById('dse_timerow');
    var shiftrow = document.getElementById('dse_shiftrow');
    if(timerow) timerow.style.display = (t.value==='kerja') ? '' : 'none';
    if(shiftrow) shiftrow.style.display = (t.value==='kerja') ? '' : 'none';
    return;
  }
  if(t.id === 'dse_shift'){
    var dsePreset = findShiftPreset(t.value);
    if(dsePreset){
      var dseStart = document.getElementById('dse_start');
      var dseEnd = document.getElementById('dse_end');
      if(dseStart) dseStart.value = dsePreset.start;
      if(dseEnd) dseEnd.value = dsePreset.end;
    }
    return;
  }
  if(t.id === 'dse_selectAll'){
    var wantChecked2 = t.checked;
    document.querySelectorAll('[data-role="dse-emp"]').forEach(function(cb){ cb.checked = wantChecked2; });
    return;
  }
  if(t.id === 'importFile'){
    var file = t.files[0];
    if(!file) return;
    if(!confirm('Impor akan MENGGANTI SELURUH data yang ada saat ini (karyawan, jadwal, absensi, dll) dengan isi file ini. Tindakan ini tidak bisa dibatalkan. Lanjutkan?')){
      t.value = '';
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var parsed = JSON.parse(ev.target.result);
        if(!parsed.employees || !parsed.settings){ toast('Format file tidak dikenali.'); return; }
        DB = parsed;
        runDBMigrations();
        saveDB().then(function(){ toast('Data berhasil diimpor.'); render(); });
      }catch(err){
        toast('Gagal membaca file JSON.');
      }
    };
    reader.readAsText(file);
  }
});

function doHrLogin(){
  try{
    var uEl = document.getElementById('li_hr_user');
    var pEl = document.getElementById('li_hr_pass');
    if(!uEl || !pEl) return;
    var u = uEl.value.trim();
    var p = pEl.value;
    if(u===DB.hr.username && p===DB.hr.password){
      SESSION = {role:'hr', empId:null, hrAccountId:null};
      STATE.view = 'dashboard'; STATE.loginError='';
      saveSessionToStorage();
      render();
      return;
    }
    var extraAcct = (DB.hrAccounts||[]).find(function(a){ return a.username===u && a.password===p; });
    if(extraAcct){
      SESSION = {role:'hr', empId:null, hrAccountId:extraAcct.id};
      STATE.view = 'dashboard'; STATE.loginError='';
      saveSessionToStorage();
      render();
      return;
    }
    STATE.loginError = 'Username atau password HR salah.';
    render();
  }catch(err){
    console.error('doHrLogin error', err);
    toast('Terjadi kesalahan saat login. Coba muat ulang halaman.');
  }
}

function doStaffLogin(){
  try{
    var userEl = document.getElementById('li_staff_user');
    var passEl = document.getElementById('li_staff_pass');
    if(!userEl || !passEl) return;
    var uname = userEl.value.trim().toLowerCase();
    var pass = passEl.value;
    var emp = DB.employees.find(function(e){ return e.active && e.username.trim().toLowerCase()===uname; });
    if(emp && emp.password===pass){
      var role = isHOD(emp.id) ? 'hod' : 'staff';
      SESSION = {role:role, empId:emp.id};
      STATE.view = 'dashboard'; STATE.loginError='';
      saveSessionToStorage();
      render();
    } else {
      STATE.loginError = 'Username atau password salah.';
      render();
    }
  }catch(err){
    console.error('doStaffLogin error', err);
    toast('Terjadi kesalahan saat login. Coba muat ulang halaman.');
  }
}

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey && e.target && e.target.id==='chatInput'){ e.preventDefault(); chatSend(); return; }
  if(e.key !== 'Enter') return;
  var t = e.target;
  if(t && t.getAttribute && t.getAttribute('data-enter-action')){
    e.preventDefault();
    var act = t.getAttribute('data-enter-action');
    if(act==='login-hr-submit') doHrLogin();
    else if(act==='login-staff-submit') doStaffLogin();
  }
});

/* ---------------------------- INIT ---------------------------- */
applyDarkModeClass();
render();
try{
  loadDB().then(function(){
    if(STATE.loaded && !STATE.loadError){ restoreSessionFromStorage(); }
    render();
  }).catch(function(err){
    /* loadDB() sendiri sudah menangani kegagalannya secara internal
       (STATE.loadError) dan tidak pernah melempar/reject ke sini dalam
       kondisi normal. Blok ini murni jaring pengaman untuk bug tak
       terduga -- SENGAJA TIDAK membuat DB kosong baru di sini, supaya
       tidak ada jalur mana pun yang bisa diam-diam menimpa data asli
       di server dengan data kosong. */
    console.error('loadDB unexpected rejection', err);
    STATE.loaded = false;
    STATE.loadError = true;
    render();
  });
}catch(err){
  console.error('init failed', err);
  STATE.loaded = false;
  STATE.loadError = true;
  render();
}

loadSidebarHiddenPref();
startLiveSync();
(function initNativeNotif(){
  var ln = nativeLocalNotif();
  if(!ln || !isNativeApp()) return;
  try{
    ln.checkPermissions().then(function(r){
      STATE.nativeNotifGranted = !!(r && r.display==='granted');
      if(r && r.display==='prompt') requestNativeNotifPermission();
    }).catch(function(){});
  }catch(e){}
})();

/* Daftarkan Service Worker lebih awal (terlepas dari status izin push)
   supaya aplikasi memenuhi syarat "Add to Home Screen" / bisa di-install
   sebagai PWA di Android. Pendaftaran untuk push (subscribe) tetap
   terpisah dan hanya terjadi saat pengguna klik "Aktifkan Notifikasi
   Perangkat". */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(err){
    console.error('SW registration (PWA) failed', err);
  });
}
