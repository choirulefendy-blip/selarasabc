name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
    tags: ["v*"]

permissions:
  contents: write   # perlu untuk melampirkan APK ke GitHub Release saat memberi tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Pasang dependensi Capacitor
        working-directory: mobile
        run: npm ci

      - name: Pasang konfigurasi Firebase (FCM)
        id: fcm
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > mobile/android/app/google-services.json
            python3 -c "import json;d=json.load(open('mobile/android/app/google-services.json'));assert 'id.abchospitality.selaras' in json.dumps(d), 'package_name di google-services.json harus id.abchospitality.selaras'"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON belum diisi - APK dibuat TANPA notifikasi FCM (app tertutup)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sinkronkan aset web ke proyek Android
        working-directory: mobile
        run: npx cap sync android

      - name: Aktifkan FCM di build Android
        if: steps.fcm.outputs.enabled == 'true'
        run: |
          F=mobile/android/app/src/main/assets/public/index.html
          grep -q "var FCM_ENABLED = false;" "$F"
          sed -i "s/var FCM_ENABLED = false;/var FCM_ENABLED = true;/" "$F"

      - name: Build APK debug (bisa langsung dipasang, tanpa keystore)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Siapkan keystore release
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK release
        if: steps.keystore.outputs.available == 'true'
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASS:-$KS_PASS}"

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ABC-Selaras-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unggah APK release
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ABC-Selaras-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

      - name: Lampirkan ke GitHub Release (saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
