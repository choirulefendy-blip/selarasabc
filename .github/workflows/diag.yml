name: Diagnosa Server
on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Nama karyawan untuk tes push (kosong = tidak kirim)'
        default: ''
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diag.mjs
        env:
          TEST_NAME: ${{ inputs.test_name }}
