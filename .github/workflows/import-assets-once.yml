name: Impor Aset (sekali jalan)
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Uji coba saja (true/false)'
        default: 'true'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-assets-once.mjs
        env:
          DRY: ${{ inputs.dry }}
