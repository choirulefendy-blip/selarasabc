<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem HR &amp; Penggajian</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --primary:#1F5D54;
    --primary-dark:#123A34;
    --primary-light:#2E7D6E;
    --gold:#C9932E;
    --bg:#F5F4EF;
    --surface:#FFFFFF;
    --border:#E3E0D5;
    --text:#1C2521;
    --text-muted:#68716C;
    --success:#2F7D5C;
    --success-bg:#E7F2EC;
    --warning:#B4791F;
    --warning-bg:#FBF0DF;
    --danger:#AE4530;
    --danger-bg:#FBEAE3;
    --neutral:#8D968F;
    --neutral-bg:#EEEDE6;
    --info:#3A6EA5;
    --info-bg:#E7EEF6;
    --radius:10px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  a{color:inherit;}

  /* ---------- Loading / Login ---------- */
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .loading-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);display:inline-block;animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(.85);}50%{opacity:1;transform:scale(1.05);}}

  .login-wrap{
    width:100%;max-width:880px;background:var(--surface);border-radius:16px;overflow:hidden;
    display:grid;grid-template-columns:1fr 1fr;box-shadow:0 20px 50px rgba(18,58,52,.18);
  }
  .login-brand{
    background:linear-gradient(155deg,var(--primary-dark),var(--primary));
    color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .login-brand h1{font-family:var(--font-serif);font-size:28px;font-weight:400;margin:0 0 12px;letter-spacing:.2px;}
  .login-brand p{color:rgba(255,255,255,.78);font-size:13.5px;max-width:280px;}
  .login-brand .brand-mark{font-size:13px;letter-spacing:1.5px;opacity:.75;text-transform:uppercase;}
  .login-brand .brand-foot{font-size:12px;color:rgba(255,255,255,.55);}
  .login-form-area{padding:44px 40px;}
  .tab-switch{display:flex;border:1px solid var(--border);border-radius:999px;padding:3px;margin-bottom:26px;}
  .tab-switch button{flex:1;border:none;background:transparent;padding:9px 0;border-radius:999px;cursor:pointer;font-weight:600;color:var(--text-muted);transition:background .15s,color .15s;}
  .tab-switch button.active{background:var(--primary);color:#fff;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--primary-light);outline-offset:1px;}
  .login-error{background:var(--danger-bg);color:var(--danger);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:13.5px;
    transition:filter .12s, background .12s;
  }
  .btn:active{filter:brightness(.94);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-light);}
  .btn-block{width:100%;}
  .btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text);}
  .btn-secondary:hover{border-color:var(--primary);}
  .btn-danger{background:#fff;border:1px solid var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-ghost{background:transparent;border:1px solid transparent;color:var(--text-muted);}
  .btn-ghost:hover{background:var(--neutral-bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .login-hint{font-size:12px;color:var(--text-muted);margin-top:14px;line-height:1.6;}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:232px;flex-shrink:0;background:var(--primary-dark);color:#fff;
    display:flex;flex-direction:column;padding:22px 0;
  }
  .sidebar-brand{padding:0 22px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .sidebar-brand .name{font-family:var(--font-serif);font-size:19px;}
  .sidebar-brand .role{font-size:11.5px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
  .nav-item{
    display:block;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.82);
    padding:11px 22px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;font-weight:500;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--gold);font-weight:700;}
  .sidebar-foot{margin-top:auto;padding:16px 22px 0;}
  .sidebar-user{font-size:12.5px;color:rgba(255,255,255,.65);margin-bottom:10px;line-height:1.5;}
  .sidebar-user strong{color:#fff;display:block;font-size:13.5px;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .topbar h2{font-family:var(--font-serif);font-weight:400;font-size:21px;margin:0;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .month-input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:600;}
  .hamburger{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;}
  .content{padding:26px 28px 60px;max-width:1180px;width:100%;}

  /* ---------- Generic components ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .card + .card{margin-top:18px;}
  .card-title{font-weight:700;font-size:15px;margin:0 0 4px;}
  .card-sub{font-size:12.5px;color:var(--text-muted);margin:0 0 16px;}
  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .stat-card .label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px;}
  .stat-card .value{font-family:var(--font-serif);font-size:26px;}
  .stat-card .sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);
     padding:9px 10px;border-bottom:2px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .muted{color:var(--text-muted);}

  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .badge-success{background:var(--success-bg);color:var(--success);}
  .badge-warning{background:var(--warning-bg);color:var(--warning);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-neutral{background:var(--neutral-bg);color:var(--neutral);}
  .badge-info{background:var(--info-bg);color:var(--info);}

  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
  .form-group input, .form-group select, .form-group textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;
  }
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:600px){.form-row{grid-template-columns:1fr;}}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0;font-size:13px;font-weight:500;color:var(--text);}

  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .section-title{font-weight:700;font-size:14.5px;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .empty-state{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13.5px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(18,26,24,.45);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:100;
  }
  .modal{background:#fff;border-radius:14px;padding:26px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 18px;font-family:var(--font-serif);font-weight:400;font-size:20px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--primary-dark);color:#fff;
    padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
  .bar-row .bar-label{width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;background:var(--neutral-bg);border-radius:6px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--warning);border-radius:6px;}
  .bar-val{width:56px;text-align:right;flex-shrink:0;color:var(--text-muted);}

  .notif-panel{
    position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:88vw;background:#fff;
    border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 32px rgba(18,26,24,.16);z-index:80;overflow:hidden;
  }
  .notif-panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
  .notif-list{max-height:340px;overflow-y:auto;}
  .notif-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;}
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--neutral-bg);}
  .notif-item.unread{background:var(--info-bg);}
  .notif-item.unread:hover{background:var(--info-bg);filter:brightness(.97);}
  .notif-item.unread::before{content:'';position:absolute;left:5px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--info);}
  .notif-item.unread .notif-msg{padding-left:12px;}
  .notif-msg{font-size:13px;line-height:1.45;}
  .notif-time{font-size:11px;color:var(--text-muted);margin-top:3px;}

  .slip{border:1px solid var(--border);border-radius:12px;padding:26px;background:#fff;}
  .slip-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--primary-dark);padding-bottom:14px;margin-bottom:16px;}
  .slip-head .co-name{font-family:var(--font-serif);font-size:20px;}
  .slip-head .co-addr{font-size:12px;color:var(--text-muted);}
  .slip-head .doc-tag{text-align:right;font-size:12px;color:var(--text-muted);}
  .slip-emp{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:18px;font-size:13px;}
  .slip-emp div span{color:var(--text-muted);}
  .slip-table th{background:var(--neutral-bg);}
  .slip-total-row td{font-weight:700;border-top:2px solid var(--primary-dark);font-size:15px;}
  .slip-foot{display:flex;justify-content:space-between;margin-top:36px;font-size:12.5px;}
  .sign-box{text-align:center;width:160px;}
  .sign-line{border-top:1px solid var(--text);margin-top:52px;padding-top:4px;}

  .deduction-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .deduction-item:last-child{border-bottom:none;}

  @media(max-width:860px){
    .sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:90;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    .sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(0,0,0,.35);}
    .hamburger{display:inline-flex;}
    .content{padding:18px 16px 50px;}
    .topbar{padding:12px 16px;}
    .login-wrap{grid-template-columns:1fr;}
    .login-brand{padding:30px 26px;}
  }

  @media print{
    .sidebar, .topbar, .no-print{display:none !important;}
    .content{padding:0;max-width:none;}
    body{background:#fff;}
    .card{border:none;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastEl" class="toast"></div>

<script>
/* =========================================================================
   SISTEM HR & PENGGAJIAN — single-file prototype
   Data disimpan lewat window.storage (shared) sehingga HR, HOD, & staff yang
   membuka artifact ini melihat data yang sama.
   ========================================================================= */

/* ---------------------------- CONSTANTS ---------------------------- */
var MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var DAY_SHORT_ID = ['Min','Sen','Sel','Rab','Kam','Jum','Sab']; // index = Date.getDay()
var WEEK_PATTERN_ROWS = [
  {wd:1,label:'Senin'},{wd:2,label:'Selasa'},{wd:3,label:'Rabu'},{wd:4,label:'Kamis'},
  {wd:5,label:'Jumat'},{wd:6,label:'Sabtu'},{wd:0,label:'Minggu'}
];
var DEPARTMENTS = ['Marketing','Finance','Administration','Service','Kitchen','Front Office','Public Area','Engineering','Housekeeping'];
var PROPERTIES = ['Kaly','Padi Heritage','Briggs Inn Surabaya','Briggs Inn Batu'];
var LEAVE_TYPES = ['Cuti Tahunan','Sakit','Izin','Lainnya'];
var LEAVE_STATUS_META = {
  pending:{label:'Menunggu', cls:'badge-warning'},
  approved:{label:'Disetujui', cls:'badge-success'},
  rejected:{label:'Ditolak', cls:'badge-danger'}
};

var DB = null;
var SESSION = {role:null, empId:null};
var STATE = {
  view:'dashboard',
  currentMonth:'2026-09',
  loginTab:'hr',
  loginError:'',
  sidebarOpen:false,
  selectedScheduleEmp:null,
  selectedAttendanceEmp:null,
  selectedHodEmp:null,
  payrollDetailEmp:null,
  patternDraft:null,
  editingEmployeeId:null,
  notifPanelOpen:false,
  loaded:false
};

var CHECKIN_DRAFT = {photoDataUrl:null, location:null, locationStatus:'idle'};
var CHECKIN_STREAM = null;
var CHECKIN_CAMERA_STATUS = 'idle'; /* idle | starting | ready | error */

function resetCheckinDraft(){
  stopCameraStream();
  CHECKIN_DRAFT = {photoDataUrl:null, location:null, locationStatus:'idle'};
  CHECKIN_CAMERA_STATUS = 'idle';
}

function stopCameraStream(){
  if(CHECKIN_STREAM){
    try{ CHECKIN_STREAM.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    CHECKIN_STREAM = null;
  }
}

function startCameraStream(){
  if(CHECKIN_CAMERA_STATUS==='starting' || CHECKIN_CAMERA_STATUS==='ready') return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    CHECKIN_CAMERA_STATUS = 'error';
    render();
    return;
  }
  CHECKIN_CAMERA_STATUS = 'starting';
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false}).then(function(stream){
    CHECKIN_STREAM = stream;
    CHECKIN_CAMERA_STATUS = 'ready';
    render();
  }).catch(function(err){
    console.error('getUserMedia error', err);
    CHECKIN_CAMERA_STATUS = 'error';
    render();
  });
}

function captureFromVideo(videoEl, maxDim, quality){
  var w = videoEl.videoWidth || 480, h = videoEl.videoHeight || 480;
  var scale = Math.min(1, maxDim / Math.max(w,h));
  var canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(w*scale));
  canvas.height = Math.max(1, Math.round(h*scale));
  var ctx = canvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality||0.6);
}

/* ---------------------------- UTILITIES ---------------------------- */
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function rupiah(n){
  n = Math.round(Number(n)||0);
  var neg = n<0; n = Math.abs(n);
  var s = n.toLocaleString('id-ID');
  return (neg?'-':'')+'Rp'+s;
}
function ymParts(ym){ var p = ym.split('-'); return {y:parseInt(p[0],10), m:parseInt(p[1],10)}; }
function daysInMonth(ym){ var p = ymParts(ym); return new Date(p.y, p.m, 0).getDate(); }
function weekdayOf(ym, day){ var p = ymParts(ym); return new Date(p.y, p.m-1, day).getDay(); }
function monthLabel(ym){ var p = ymParts(ym); return MONTHS_ID[p.m-1]+' '+p.y; }
function timeToMinutes(t){
  if(!t || t.indexOf(':')===-1) return null;
  var parts = t.split(':'); return parseInt(parts[0],10)*60+parseInt(parts[1],10);
}
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function formatDateID(iso){
  if(!iso) return '-';
  var p = iso.split('-');
  var y=p[0], m=parseInt(p[1],10), d=parseInt(p[2],10);
  if(!m || !d) return iso;
  return d+' '+MONTHS_ID[m-1]+' '+y;
}

function eachDateInRange(startISO, endISO, cb){
  var start = new Date(startISO+'T00:00:00');
  var end = new Date(endISO+'T00:00:00');
  if(isNaN(start) || isNaN(end)) return;
  var cur = new Date(start);
  var guard = 0;
  while(cur.getTime() <= end.getTime() && guard < 400){
    cb(cur.getFullYear(), cur.getMonth()+1, cur.getDate());
    cur.setDate(cur.getDate()+1);
    guard++;
  }
}

function timeAgoID(iso){
  if(!iso) return '';
  var then = new Date(iso).getTime();
  if(isNaN(then)) return '';
  var diffSec = Math.max(0, Math.floor((Date.now()-then)/1000));
  if(diffSec < 60) return 'Baru saja';
  var diffMin = Math.floor(diffSec/60);
  if(diffMin < 60) return diffMin+' menit lalu';
  var diffHour = Math.floor(diffMin/60);
  if(diffHour < 24) return diffHour+' jam lalu';
  var diffDay = Math.floor(diffHour/24);
  if(diffDay < 7) return diffDay+' hari lalu';
  var d = new Date(iso);
  return d.getDate()+' '+MONTHS_ID[d.getMonth()]+' '+d.getFullYear();
}

/* audience: {type:'hr'} atau {type:'emp', empId:'...'} */
function addNotification(audience, message, link){
  DB.notifications = DB.notifications || [];
  DB.notifications.unshift({
    id: uid('N'),
    audience: audience,
    message: message,
    link: link || null,
    createdAt: new Date().toISOString(),
    read: false
  });
  if(DB.notifications.length > 200) DB.notifications = DB.notifications.slice(0,200);
}

function myNotifications(){
  if(!SESSION.role || !DB || !DB.notifications) return [];
  return DB.notifications.filter(function(n){
    if(SESSION.role==='hr') return n.audience && n.audience.type==='hr';
    return n.audience && n.audience.type==='emp' && n.audience.empId===SESSION.empId;
  });
}

function unreadNotifCount(){
  return myNotifications().filter(function(n){ return !n.read; }).length;
}

function toast(msg){
  var el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

/* ---------------------------- SEED DATA ---------------------------- */
function defaultWeekPattern(){
  var p = {};
  for(var i=0;i<7;i++){
    p[i] = (i===0) ? {type:'libur'} : {type:'kerja', start:'08:30', end:'17:00'};
  }
  return p;
}

function applyWeeklyPatternToMonth(db, ym, empId, pattern){
  var n = daysInMonth(ym);
  db.schedules[ym] = db.schedules[ym] || {};
  db.schedules[ym][empId] = db.schedules[ym][empId] || {};
  for(var d=1; d<=n; d++){

/* ---------------------------- STORAGE ----------------------------
   Tiga lapis penyimpanan, dicoba berurutan:
   1) REMOTE (Google Apps Script + Google Spreadsheet) — kalau REMOTE_API_URL
      di bawah ini diisi, semua HR/HOD/Staff yang membuka situs berbagi data
      yang sama, dari perangkat mana pun. Ini yang dipakai saat sudah di-deploy.
   2) window.storage bawaan artifact (kalau dibuka lewat pratinjau Claude).
   3) localStorage per-browser, lalu memori sementara sebagai jaga-jaga
      terakhir kalau semuanya diblokir.

   ==> ISI URL WEB APP GOOGLE APPS SCRIPT DI SINI SEBELUM DEPLOY KE NETLIFY.
   Lihat file Code.gs & panduan deploy yang disertakan untuk cara membuatnya.
   Kosongkan ('') untuk memakai penyimpanan lokal per-browser saja. */
var REMOTE_API_URL = 'https://script.google.com/macros/s/AKfycbyKlltnE63iz8GWLkcyFEFJJPJPi7P7FoHzMykZOV6JDw5ugT02HNrdSr4-YwT-PKV0/exec';

var STORAGE_MODE = 'unknown';

function hasRemoteStorage(){
  return !!REMOTE_API_URL;
}

function remoteGet(key){
  return fetch(REMOTE_API_URL + '?key=' + encodeURIComponent(key), {method:'GET'})
    .then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    })
    .then(function(json){
      return (json && json.value) ? {key:key, value:json.value} : null;
    });
}
function remoteSet(key, value){
  // Content-Type text/plain menghindari CORS preflight yang tidak didukung Apps Script.
  return fetch(REMOTE_API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({key:key, value:value})
  }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(){
    return {key:key, value:value};
  });
}

function hasArtifactStorage(){
  return typeof window.storage === 'object' && window.storage !== null && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}

function localGet(key){
  try{
    var raw = window.localStorage.getItem(key);
    return raw ? {key:key, value:raw} : null;
  }catch(e){
    return (window.__memStore && window.__memStore[key]) ? {key:key, value:window.__memStore[key]} : null;
  }
}
function localSet(key, value){
  try{
    window.localStorage.setItem(key, value);
    return {key:key, value:value};
  }catch(e){
    window.__memStore = window.__memStore || {};
    window.__memStore[key] = value;
    return {key:key, value:value};
  }
}

function fallbackGet(key){
  if(hasArtifactStorage()){
    try{
      return window.storage.get(key, true).then(function(res){
        STORAGE_MODE = 'artifact';
        return res;
      }).catch(function(){
        STORAGE_MODE = 'local';
        return localGet(key);
      });
    }catch(e){
      STORAGE_MODE = 'local';
      return Promise.resolve(localGet(key));
    }
  }
  STORAGE_MODE = 'local';
  return Promise.resolve(localGet(key));
}
function fallbackSet(key, value){
  if(hasArtifactStorage()){
    try{
      return window.storage.set(key, value, true).then(function(res){
        STORAGE_MODE = 'artifact';
        return res;
      }).catch(function(){
        STORAGE_MODE = 'local';
        return localSet(key, value);
      });
    }catch(e){
      STORAGE_MODE = 'local';
      return Promise.resolve(localSet(key, value));
    }
  }
  STORAGE_MODE = 'local';
  return Promise.resolve(localSet(key, value));
}

function storageGet(key){
  if(hasRemoteStorage()){
    return remoteGet(key).then(function(res){
      STORAGE_MODE = 'remote';
      return res;
    }).catch(function(err){
      console.error('remoteGet gagal, memakai cadangan lokal', err);
      return fallbackGet(key);
    });
  }
  return fallbackGet(key);
}
function storageSet(key, value){
  if(hasRemoteStorage()){
    return remoteSet(key, value).then(function(res){
      STORAGE_MODE = 'remote';
      return res;
    }).catch(function(err){
      console.error('remoteSet gagal, memakai cadangan lokal', err);
      return fallbackSet(key, value);
    });
  }
  return fallbackSet(key, value);
}

/* ---------------------------- CHUNKED FILE STORAGE ----------------------------
   Sel Google Spreadsheet dibatasi ~50.000 karakter, jadi file (foto/dokumen)
   yang disimpan sebagai base64 dipecah jadi beberapa "chunk" dan disimpan
   sebagai key terpisah, lalu disambung lagi saat dibaca. */
var FILE_CHUNK_SIZE = 40000;

function storageSetChunked(baseKey, longString, onProgress){
  var chunks = [];
  for(var i=0; i<longString.length; i+=FILE_CHUNK_SIZE){
    chunks.push(longString.slice(i, i+FILE_CHUNK_SIZE));
  }
  if(chunks.length===0) chunks.push('');
  var done = 0;
  var writeNext = function(idx){
    if(idx>=chunks.length){
      return storageSet(baseKey+'__meta', JSON.stringify({count:chunks.length}));
    }
    return storageSet(baseKey+'__chunk'+idx, chunks[idx]).then(function(){
      done++;
      if(onProgress) onProgress(done, chunks.length);
      return writeNext(idx+1);
    });
  };
  return writeNext(0);
}

function storageGetChunked(baseKey){
  return storageGet(baseKey+'__meta').then(function(metaRes){
    if(!metaRes || !metaRes.value) return null;
    var meta;
    try{ meta = JSON.parse(metaRes.value); }catch(e){ return null; }
    var parts = [];
    var readNext = function(idx){
      if(idx>=meta.count) return Promise.resolve(parts.join(''));
      return storageGet(baseKey+'__chunk'+idx).then(function(res){
        parts.push(res && res.value ? res.value : '');
        return readNext(idx+1);
      });
    };
    return readNext(0);
  });
}

/* ---------------------------- IMAGE COMPRESSION ---------------------------- */
function compressImageFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w,h));
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL('image/jpeg', quality||0.6));
      };
      img.onerror = function(){ reject(new Error('Gagal memuat gambar.')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('Gagal membaca file.')); };
    reader.readAsDataURL(file);
  });
}

function readFileAsDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){ resolve(e.target.result); };
    reader.onerror = function(){ reject(new Error('Gagal membaca file.')); };
    reader.readAsDataURL(file);
  });
}

function getEmployee(id){
  for(var i=0;i<DB.employees.length;i++){ if(DB.employees[i].id===id) return DB.employees[i]; }
  return null;
}
function activeEmployees(){ return DB.employees.filter(function(e){ return e.active; }); }

function getMatchDay(empId, ym, day){
  var sched = DB.schedules[ym] && DB.schedules[ym][empId] ? DB.schedules[ym][empId][day] : null;
  var att = DB.attendance[ym] && DB.attendance[ym][empId] ? DB.attendance[ym][empId][day] : null;

  if(!sched){
    return {status:'unset', sched:null, att:att, lateMinutes:0};
  }
  if(sched.type==='libur'){
    if(att && att.checkIn){
      return {status:'lembur', sched:sched, att:att, lateMinutes:0};
    }
    if(sched.cuti){
      return {status:'cuti', sched:sched, att:att, lateMinutes:0};
    }
    return {status:'libur', sched:sched, att:att, lateMinutes:0};
  }
  // kerja
  if(!att || !att.checkIn){
    var today = new Date(); today.setHours(0,0,0,0);
    var thisDay = new Date(ymParts(ym).y, ymParts(ym).m-1, day);
    if(thisDay.getTime() > today.getTime()){
      return {status:'akan_datang', sched:sched, att:att, lateMinutes:0};
    }
    return {status:'alpha', sched:sched, att:att, lateMinutes:0};
  }
  var startMin = timeToMinutes(sched.start);
  var grace = DB.settings.gracePeriodMinutes || 0;
  var inMin = timeToMinutes(att.checkIn);
  var lateBy = inMin - startMin - grace;
  if(lateBy > 0){
    return {status:'telat', sched:sched, att:att, lateMinutes:lateBy};
  }
  return {status:'hadir', sched:sched, att:att, lateMinutes:0};
}

function getMonthSummary(empId, ym){
  var n = daysInMonth(ym);
  var days = [];
  var totals = {hadir:0, telat:0, alpha:0, libur:0, lembur:0, unset:0, akan_datang:0, cuti:0, totalLateMinutes:0};
  for(var d=1; d<=n; d++){
    var m = getMatchDay(empId, ym, d);
    m.day = d;
    m.weekday = weekdayOf(ym, d);
    days.push(m);
    if(totals[m.status] !== undefined) totals[m.status]++;
    totals.totalLateMinutes += (m.lateMinutes||0);
  }
  return {days:days, totals:totals};
}

function computePayroll(empId, ym){
  var emp = getEmployee(empId);
  if(!emp) return null;
  var summary = getMonthSummary(empId, ym);
  var settings = DB.settings;
  var lateDeduction = summary.totals.totalLateMinutes * (settings.lateRatePerMinute||0);
  if(settings.lateDeductionCap && settings.lateDeductionCap>0 && lateDeduction > settings.lateDeductionCap){
    lateDeduction = settings.lateDeductionCap;
  }
  var bpjsKes = emp.bpjsKesehatanActive!==false ? Math.round(emp.baseSalary * (settings.bpjsKesehatanPct||0)/100) : 0;
  var bpjsTK = emp.bpjsKetenagakerjaanActive!==false ? Math.round(emp.baseSalary * (settings.bpjsKetenagakerjaanPct||0)/100) : 0;
  var others = (DB.otherDeductions[ym] && DB.otherDeductions[ym][empId]) || [];
  var othersTotal = others.reduce(function(s,o){ return s + (Number(o.amount)||0); }, 0);
  var totalDeduction = lateDeduction + bpjsKes + bpjsTK + othersTotal;
  var thp = emp.baseSalary - totalDeduction;
  return {
    emp:emp, ym:ym, summary:summary,
    lateDeduction:lateDeduction, bpjsKes:bpjsKes, bpjsTK:bpjsTK,
    others:others, othersTotal:othersTotal, totalDeduction:totalDeduction, thp:thp
  };
}

function purgeEmployeeData(empId){
  ['schedules','attendance','otherDeductions'].forEach(function(bucket){
    Object.keys(DB[bucket]).forEach(function(ym){
      if(DB[bucket][ym][empId]) delete DB[bucket][ym][empId];
    });
  });
}

/* ---------------------------- SPREADSHEET IMPORT (HR) ---------------------------- */
function findEmployeeByName(name){
  if(!name) return null;
  var n = String(name).trim().toLowerCase();
  if(!n) return null;
  var exact = DB.employees.find(function(e){ return e.name.trim().toLowerCase()===n; });
  if(exact) return exact;
  return DB.employees.find(function(e){
    var en = e.name.trim().toLowerCase();
    return n.indexOf(en)!==-1 || en.indexOf(n)!==-1;
  }) || null;
}

function excelValueToTime(v){
  if(v===null || v===undefined || v==='') return null;
  if(Object.prototype.toString.call(v)==='[object Date]' && !isNaN(v)){
    return pad2(v.getHours())+':'+pad2(v.getMinutes());
  }
  if(typeof v === 'number'){
    var totalMinutes = Math.round((v % 1) * 24 * 60);
    if(totalMinutes<=0) return null;
    return pad2(Math.floor(totalMinutes/60))+':'+pad2(totalMinutes%60);
  }
  var s = String(v).trim();
  var m = s.match(/(\d{1,2}):(\d{2})/);
  if(m) return pad2(parseInt(m[1],10)%24)+':'+m[2];
  return null;
}

function excelValueToDayInfo(v, fallbackYm){
  if(v===null || v===undefined || v==='') return null;
  if(Object.prototype.toString.call(v)==='[object Date]' && !isNaN(v)){
    return {y:v.getFullYear(), m:v.getMonth()+1, d:v.getDate()};
  }
  var s = String(v).trim();
  if(s.indexOf('-')!==-1 || s.indexOf('/')!==-1){
    var norm = s.replace(/\//g,'-');
    var parts = norm.split('-');
    if(parts.length===3){
      var a = parseInt(parts[0],10), b = parseInt(parts[1],10), c = parseInt(parts[2],10);
      if(parts[0].length===4) return {y:a, m:b, d:c};
      return {y:c, m:b, d:a};
    }
  }
  var day = parseInt(s,10);
  if(!isNaN(day) && day>=1 && day<=31){
    var p = ymParts(fallbackYm);
    return {y:p.y, m:p.m, d:day};
  }
  return null;
}

function downloadAttendanceTemplate(){
  if(!window.XLSX){ toast('Modul spreadsheet belum siap, coba lagi beberapa saat.'); return; }
  var ym = STATE.currentMonth;
  var n = daysInMonth(ym);
  var rows = [['Nama Karyawan','Tanggal','Jam Masuk','Jam Pulang']];
  activeEmployees().forEach(function(e){
    for(var d=1; d<=n; d++){
      rows.push([e.name, ym+'-'+pad2(d), '', '']);
    }
  });
  try{
    var ws = window.XLSX.utils.aoa_to_sheet(rows);
    var wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, 'Absensi');
    window.XLSX.writeFile(wb, 'Template-Absensi-'+ym+'.xlsx');
  }catch(e){
    toast('Gagal membuat template.');
  }
}

function importAttendanceSpreadsheet(file){
  if(!window.XLSX){ toast('Modul spreadsheet belum siap, coba lagi beberapa saat.'); return; }
  var statusEl = document.getElementById('importSpreadsheetStatus');
  if(statusEl) statusEl.textContent = 'Membaca file...';
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = new Uint8Array(ev.target.result);
      var wb = window.XLSX.read(data, {type:'array', cellDates:true});
      var sheet = wb.Sheets[wb.SheetNames[0]];
      var rows = window.XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      var imported = 0, skipped = 0;
      rows.forEach(function(row){
        if(!row || row.length < 3) { return; }
        var emp = findEmployeeByName(row[0]);
        if(!emp){ skipped++; return; }
        var dayInfo = excelValueToDayInfo(row[1], STATE.currentMonth);
        if(!dayInfo){ skipped++; return; }
        var ym = dayInfo.y+'-'+pad2(dayInfo.m);
        var checkIn = excelValueToTime(row[2]);
        var checkOut = row.length>3 ? excelValueToTime(row[3]) : null;
        if(!checkIn){ skipped++; return; }
        DB.attendance[ym] = DB.attendance[ym] || {};
        DB.attendance[ym][emp.id] = DB.attendance[ym][emp.id] || {};
        DB.attendance[ym][emp.id][dayInfo.d] = {checkIn:checkIn, checkOut:checkOut};
        imported++;
      });
      saveDB().then(function(){
        closeModal();
        toast(imported+' baris absensi diimpor'+(skipped?', '+skipped+' baris dilewati':'')+'.');
        render();
      });
    }catch(err){
      console.error(err);
      if(statusEl) statusEl.textContent = 'Gagal membaca file. Pastikan formatnya sesuai template.';
      else toast('Gagal membaca file. Pastikan formatnya sesuai template.');
    }
  };
  reader.onerror = function(){
    if(statusEl) statusEl.textContent = 'Gagal membaca file.';
  };
  reader.readAsArrayBuffer(file);
}

function renderCheckinPage(){
  var empId = SESSION.empId;
  var now = new Date();
  var ym = now.getFullYear()+'-'+pad2(now.getMonth()+1);
  var day = now.getDate();
  var att = (DB.attendance[ym] && DB.attendance[ym][empId] && DB.attendance[ym][empId][day]) || null;
  var hasIn = att && att.checkIn;
  var hasOut = att && att.checkOut;

  if(CHECKIN_DRAFT.locationStatus === 'idle'){
    CHECKIN_DRAFT.locationStatus = 'loading';
    getLocationOnce().then(function(loc){
      CHECKIN_DRAFT.location = loc;
      CHECKIN_DRAFT.locationStatus = loc ? 'ok' : 'unavailable';
      render();
    });
  }

  var locText = CHECKIN_DRAFT.locationStatus==='loading' ? 'Mengambil lokasi...' :
    CHECKIN_DRAFT.locationStatus==='ok' ? ('Lokasi terdeteksi (akurasi &plusmn;'+Math.round(CHECKIN_DRAFT.location.accuracy||0)+' m).') :
    'Lokasi tidak tersedia &mdash; tetap bisa absen tanpa lokasi.';

  var summaryCard = ''+
  '<div class="card">'+
    '<div class="card-title">Absensi Hari Ini</div>'+
    '<div class="card-sub">'+formatDateID(todayISO())+'</div>'+
    '<div class="grid grid-2">'+
      '<div class="stat-card"><div class="label">Jam Masuk</div><div class="value" style="font-size:20px;">'+(hasIn?att.checkIn:'&mdash;')+'</div>'+(hasIn&&att.checkInHasPhoto?'<div class="sub">Foto &amp; lokasi tersimpan</div>':'')+'</div>'+
      '<div class="stat-card"><div class="label">Jam Pulang</div><div class="value" style="font-size:20px;">'+(hasOut?att.checkOut:'&mdash;')+'</div>'+(hasOut&&att.checkOutHasPhoto?'<div class="sub">Foto &amp; lokasi tersimpan</div>':'')+'</div>'+
    '</div>'+
  '</div>';

  var actionCard;
  if(!hasIn){
    actionCard = renderCheckinActionCard('in', 'Absen Masuk', locText);
  } else if(!hasOut){
    actionCard = renderCheckinActionCard('out', 'Absen Pulang', locText);
  } else {
    stopCameraStream();
    actionCard = '<div class="card"><div class="empty-state">Absen hari ini sudah lengkap. Sampai jumpa besok!</div></div>';
  }

  return summaryCard + actionCard;
}

/* ---------------------------- PDF EXPORT ---------------------------- */
function downloadSlipPDF(empId){
  if(!window.jspdf){ toast('Modul PDF belum siap, coba lagi beberapa saat.'); return; }
  var ym = STATE.currentMonth;
  var p = computePayroll(empId, ym);
  var emp = p.emp;
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({unit:'pt', format:'a4'});
  var left = 42, right = 553, y = 56;

  doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text(DB.company.name, left, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  y += 16; doc.text(DB.company.address, left, y);
  doc.setTextColor(0);
  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('SLIP GAJI', right, 56, {align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Periode ' + monthLabel(ym), right, 72, {align:'right'});

  y += 14; doc.setDrawColor(18,58,52); doc.setLineWidth(1.4); doc.line(left, y, right, y);
  y += 26;

  doc.setFontSize(10);
  function pair(label, value, yy, xLabel, xValue){
    doc.setTextColor(110); doc.text(label, xLabel, yy);
    doc.setTextColor(0); doc.setFont('helvetica','bold'); doc.text(value, xValue, yy);
    doc.setFont('helvetica','normal');
  }
  pair('Nama', emp.name, y, left, left+90);
  pair('ID Karyawan', emp.id, y, left+270, left+360);
  y += 18;
  pair('Jabatan', emp.position, y, left, left+90);
  pair('Departemen', emp.department, y, left+270, left+360);
  y += 30;

  function sectionHeader(title, yy){
    doc.setFillColor(238,237,230);
    doc.rect(left, yy-12, right-left, 20, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(0);
    doc.text(title, left+6, yy+2);
    doc.text('Jumlah', right-6, yy+2, {align:'right'});
    doc.setFont('helvetica','normal');
  }
  function row(label, value, yy, bold){
    doc.setFont('helvetica', bold?'bold':'normal');
    doc.text(label, left+6, yy);
    doc.text(value, right-6, yy, {align:'right'});
  }

  sectionHeader('PENDAPATAN', y); y += 22;
  row('Gaji Pokok', rupiah(emp.baseSalary), y); y += 26;

  sectionHeader('POTONGAN', y); y += 22;
  row('BPJS Kesehatan ('+(DB.settings.bpjsKesehatanPct||0)+'%)', rupiah(p.bpjsKes), y); y += 18;
  row('BPJS Ketenagakerjaan ('+(DB.settings.bpjsKetenagakerjaanPct||0)+'%)', rupiah(p.bpjsTK), y); y += 18;
  row('Potongan Keterlambatan ('+p.summary.totals.totalLateMinutes+' menit)', rupiah(p.lateDeduction), y); y += 18;
  p.others.forEach(function(o){
    row(o.label, rupiah(o.amount), y); y += 18;
  });
  doc.setDrawColor(200); doc.line(left, y, right, y); y += 16;
  row('Total Potongan', rupiah(p.totalDeduction), y, true); y += 30;

  doc.setFillColor(18,58,52); doc.rect(left, y-16, right-left, 26, 'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('TAKE HOME PAY', left+6, y+1);
  doc.text(rupiah(p.thp), right-6, y+1, {align:'right'});
  doc.setTextColor(0);
  y += 60;

  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120);
  doc.text('Dicetak: '+todayISO()+' - Dokumen dibuat otomatis oleh Sistem HR.', left, y);
  doc.setTextColor(0);
  y += 60;
  doc.setFontSize(10);
  doc.text('Mengetahui, HR/Admin', left+30, y);
  doc.text(emp.name, right-130, y);
  doc.line(left, y-8, left+120, y-8);
  doc.line(right-150, y-8, right-30, y-8);

  doc.save('Slip-Gaji-'+emp.name.replace(/\s+/g,'_')+'-'+ym+'.pdf');
  toast('Slip gaji diunduh.');
}

/* ---------------------------- EVENT HANDLING ---------------------------- */
function readScheduleFormIntoDB(empId, ym){
  DB.schedules[ym] = DB.schedules[ym] || {};
  DB.schedules[ym][empId] = DB.schedules[ym][empId] || {};
  var body = document.getElementById('scheduleDayBody');
  if(!body) return;
  var rowsEls = body.querySelectorAll('tr');
  rowsEls.forEach(function(tr){
    var typeSel = tr.querySelector('[data-role="day-type"]');
    if(!typeSel) return;
    var day = typeSel.getAttribute('data-day');
    var type = typeSel.value;
    if(type==='kerja'){
      var start = tr.querySelector('[data-role="day-start"]').value || '08:30';
      var end = tr.querySelector('[data-role="day-end"]').value || '17:00';
      DB.schedules[ym][empId][day] = {type:'kerja', start:start, end:end};
    } else {
      DB.schedules[ym][empId][day] = {type:'libur'};
    }
  });
}

function readAttendanceFormIntoDB(empId, ym){
  DB.attendance[ym] = DB.attendance[ym] || {};
  DB.attendance[ym][empId] = DB.attendance[ym][empId] || {};
  var body = document.getElementById('attendanceDayBody');
  if(!body) return;
  var rowsEls = body.querySelectorAll('tr');
  rowsEls.forEach(function(tr){
    var inEl = tr.querySelector('[data-role="att-in"]');
    if(!inEl) return;
    var day = inEl.getAttribute('data-day');
    var outEl = tr.querySelector('[data-role="att-out"]');
    var checkIn = inEl.value || null;
    var checkOut = outEl.value || null;
    if(checkIn){
      DB.attendance[ym][empId][day] = {checkIn:checkIn, checkOut:checkOut};
    } else {
      delete DB.attendance[ym][empId][day];
    }
  });
}

function openModal(html){
  document.getElementById('modalRoot').innerHTML = html;
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

document.addEventListener('click', function(e){
  var overlay = e.target.closest('[data-action="overlay-close"]');
  if(overlay && e.target === overlay){ closeModal(); return; }

  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');

  try{

  if(action==='login-tab'){
    STATE.loginTab = el.getAttribute('data-tab');
    STATE.loginError = '';
    render();
  } else if(action==='login-hr-submit'){
    doHrLogin();
  } else if(action==='login-staff-submit'){
    doStaffLogin();
  } else if(action==='logout'){
    SESSION = {role:null, empId:null};
    STATE.view = 'dashboard';
    STATE.loginError = '';
    STATE.notifPanelOpen = false;
    render();
  } else if(action==='nav'){
    STATE.view = el.getAttribute('data-view');
    STATE.sidebarOpen = false;
    STATE.notifPanelOpen = false;
    render();
  } else if(action==='toggle-sidebar'){
    STATE.sidebarOpen = !STATE.sidebarOpen;
    render();
  } else if(action==='toggle-notifications'){
    STATE.notifPanelOpen = !STATE.notifPanelOpen;
    render();

  }catch(err){
    console.error('click action error ['+action+']', err);
    toast('Terjadi kesalahan tak terduga. Coba muat ulang halaman.');
  }
});

document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id === 'topbarMonth'){
    // preserve any unsaved in-memory edits on the current page before switching month
    if(STATE.view==='schedule' && document.getElementById('scheduleDayBody')){
      readScheduleFormIntoDB(STATE.selectedScheduleEmp, STATE.currentMonth);
    } else if(STATE.view==='attendance' && document.getElementById('attendanceDayBody')){
      readAttendanceFormIntoDB(STATE.selectedAttendanceEmp, STATE.currentMonth);
    }
    STATE.currentMonth = t.value;
    render();
    return;
  }
  if(t.id === 'scheduleEmpSelect'){
    readScheduleFormIntoDB(STATE.selectedScheduleEmp, STATE.currentMonth);
    STATE.selectedScheduleEmp = t.value;
    render();
    return;
  }
  if(t.id === 'attendanceEmpSelect'){
    readAttendanceFormIntoDB(STATE.selectedAttendanceEmp, STATE.currentMonth);
    STATE.selectedAttendanceEmp = t.value;
    render();
    return;
  }
  if(t.id === 'hodEmpSelect'){
    STATE.selectedHodEmp = t.value;
    render();
    return;
  }
  if(t.id === 'attSpreadsheetFile'){
    var f = t.files[0];
    if(f) importAttendanceSpreadsheet(f);
    return;
  }
  if(t.getAttribute('data-role')==='pattern-type'){
    var wd = t.getAttribute('data-wd');
    STATE.patternDraft[wd] = STATE.patternDraft[wd] || {};
    STATE.patternDraft[wd].type = t.value;
    if(t.value==='kerja' && !STATE.patternDraft[wd].start){
      STATE.patternDraft[wd].start = '08:30'; STATE.patternDraft[wd].end = '17:00';
    }
    readScheduleFormIntoDB(STATE.selectedScheduleEmp, STATE.currentMonth);
    render();
    return;
  }
  if(t.getAttribute('data-role')==='pattern-start'){
    STATE.patternDraft[t.getAttribute('data-wd')].start = t.value; return;
  }
  if(t.getAttribute('data-role')==='pattern-end'){
    STATE.patternDraft[t.getAttribute('data-wd')].end = t.value; return;
  }
  if(t.getAttribute('data-role')==='day-type'){
    // toggle time input disabled state without full re-render to keep it snappy
    readScheduleFormIntoDB(STATE.selectedScheduleEmp, STATE.currentMonth);
    render();
    return;
  }
  if(t.id === 'importFile'){
    var file = t.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var parsed = JSON.parse(ev.target.result);
        if(!parsed.employees || !parsed.settings){ toast('Format file tidak dikenali.'); return; }
        DB = parsed;
        if(!DB.otherDeductions) DB.otherDeductions = {};
        saveDB().then(function(){ toast('Data berhasil diimpor.'); render(); });
      }catch(err){
        toast('Gagal membaca file JSON.');
      }
    };
    reader.readAsText(file);
  }
});

function doHrLogin(){
  try{
    var uEl = document.getElementById('li_hr_user');
    var pEl = document.getElementById('li_hr_pass');
    if(!uEl || !pEl) return;
    var u = uEl.value.trim();
    var p = pEl.value;
    if(u===DB.hr.username && p===DB.hr.password){
      SESSION = {role:'hr', empId:null};
      STATE.view = 'dashboard'; STATE.loginError='';
      render();
    } else {
      STATE.loginError = 'Username atau password HR salah.';
      render();
    }
  }catch(err){
    console.error('doHrLogin error', err);
    toast('Terjadi kesalahan saat login. Coba muat ulang halaman.');
  }
}

function doStaffLogin(){
  try{
    var empEl = document.getElementById('li_staff_emp');
    var passEl = document.getElementById('li_staff_pass');
    if(!empEl || !passEl) return;
    var empId = empEl.value;
    var pass = passEl.value;
    var emp = getEmployee(empId);
    if(emp && emp.password===pass){
      var role = (empId === DB.hodEmpId) ? 'hod' : 'staff';
      SESSION = {role:role, empId:empId};
      STATE.view = 'dashboard'; STATE.loginError='';
      render();
    } else {
      STATE.loginError = 'Password salah.';
      render();
    }
  }catch(err){
    console.error('doStaffLogin error', err);
    toast('Terjadi kesalahan saat login. Coba muat ulang halaman.');
  }
}

document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  var t = e.target;
  if(t && t.getAttribute && t.getAttribute('data-enter-action')){
    e.preventDefault();
    var act = t.getAttribute('data-enter-action');
    if(act==='login-hr-submit') doHrLogin();
    else if(act==='login-staff-submit') doStaffLogin();
  }
});

/* ---------------------------- INIT ---------------------------- */
render();
try{
  loadDB().then(function(){ render(); }).catch(function(err){
    console.error('loadDB failed', err);
    DB = seedData();
    STATE.loaded = true;
    STORAGE_MODE = 'memory';
    render();
  });
}catch(err){
  console.error('init failed', err);
  DB = seedData();
  STATE.loaded = true;
  STORAGE_MODE = 'memory';
  render();
}
</script>
